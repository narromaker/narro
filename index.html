/* ---------- INPUT EVENTS ---------- */
let allowSubmitBlur = false;
let lastPointerDownTarget = null;
let lastPointerDownX = null;
let lastPointerDownY = null;

function rememberLastTapTarget(e) {
  let target = e.target;

  if (!(target instanceof Element) && target?.parentElement) {
    target = target.parentElement;
  }

  lastPointerDownTarget = target instanceof Element ? target : null;

  if (typeof e.clientX === "number" && typeof e.clientY === "number") {
    lastPointerDownX = e.clientX;
    lastPointerDownY = e.clientY;
  } else if (e.touches?.[0]) {
    lastPointerDownX = e.touches[0].clientX;
    lastPointerDownY = e.touches[0].clientY;
  }
}

document.addEventListener("pointerdown", rememberLastTapTarget, true);
document.addEventListener("touchstart", rememberLastTapTarget, true);

function shouldRetainKeyboardOnBlur() {
  if (!isMobile()) return false;
  if (allowSubmitBlur) return false;

  let tapTarget = lastPointerDownTarget;
  if (
    !(tapTarget instanceof Element) &&
    Number.isFinite(lastPointerDownX) &&
    Number.isFinite(lastPointerDownY)
  ) {
    tapTarget = document.elementFromPoint(lastPointerDownX, lastPointerDownY);
  }
  if (!(tapTarget instanceof Element)) return false;
  if (tapTarget.closest("#guessBtn") && !gameOver) return true;

  const value = String(input.value ?? "").trim();
  if (!value) return false;

  const appRoot = document.querySelector(".app");
  if (!appRoot) return false;

  const appRect = appRoot.getBoundingClientRect();
  const tapInsideAppRect =
    Number.isFinite(lastPointerDownX) &&
    Number.isFinite(lastPointerDownY) &&
    lastPointerDownX >= appRect.left &&
    lastPointerDownX <= appRect.right &&
    lastPointerDownY >= appRect.top &&
    lastPointerDownY <= appRect.bottom;

  if (!appRoot.contains(tapTarget) && !tapInsideAppRect) return false;

  // Allow blur on intentional controls/taps; retain only for accidental
  // non-interactive taps on the app surface.
  if (
    tapTarget.closest(
      "#guessBtn, #guessInput, #demoControls button, .bar, .stats-btn, #themeToggleBtn, #languageMenuBtn, #languageMenu, #shareBtn, #feedbackBtn, #statsModal, #freePlayPanel button"
    )
  ) {
    return false;
  }

  return true;
}

input.addEventListener("blur", () => {
  if (shouldRetainKeyboardOnBlur()) {
    setTimeout(() => {
      if (document.activeElement !== input && !gameOver) {
        try {
          input.focus({ preventScroll: true });
        } catch {
          input.focus();
        }
      }
    }, 0);
    return;
  }

  handleKeyboardBlur();
  allowSubmitBlur = false;
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    if (!btn.disabled) btn.click();
  }
});

/* ---------- SAVED STATE RESTORE ---------- */
function clearTodayDailyState() {
  localStorage.removeItem(dailyStateKey);
  localStorage.removeItem(dailyStateKey + "-result");
}

function normalizeDailySavedState(rawState) {
  if (!rawState || typeof rawState !== "object") return null;

  const mode = rawState.mode || MODES.DAILY;
  if (mode !== MODES.DAILY) return null;

  const result =
    rawState.result === "win" || rawState.result === "lose"
      ? rawState.result
      : null;

  if (!Array.isArray(rawState.guesses)) return null;
  const savedGuesses = rawState.guesses.map(Number);
  if (
    savedGuesses.some(
      g => !Number.isInteger(g) || g < MIN_RANGE || g > MAX_RANGE
    )
  ) {
    return null;
  }
  if (savedGuesses.length > MAX_GUESSES) return null;

  const lifelineUsed = !!rawState.lifelineUsed;
  let lifelineGuessIndex = null;
  if (
    Number.isInteger(rawState.lifelineGuessIndex) &&
    rawState.lifelineGuessIndex >= 0 &&
    rawState.lifelineGuessIndex <= savedGuesses.length
  ) {
    lifelineGuessIndex = rawState.lifelineGuessIndex;
  }

  const hasRange =
    Number.isInteger(rawState.min) &&
    Number.isInteger(rawState.max) &&
    rawState.min >= MIN_RANGE &&
    rawState.max <= MAX_RANGE &&
    rawState.min <= rawState.max;

  // In-progress state must carry a valid range and cannot be exhausted.
  if (result == null) {
    if (!hasRange) return null;
    if (savedGuesses.length >= MAX_GUESSES) return null;
  }

  return {
    mode: MODES.DAILY,
    result,
    guesses: savedGuesses,
    lifelineUsed,
    lifelineGuessIndex,
    min: hasRange ? rawState.min : MIN_RANGE,
    max: hasRange ? rawState.max : MAX_RANGE
  };
}

const savedState = localStorage.getItem(dailyStateKey);
let parsedSavedState = null;

if (savedState) {
  try {
    parsedSavedState = normalizeDailySavedState(JSON.parse(savedState));
    if (!parsedSavedState) {
      console.warn("Saved daily state failed validation; resetting daily state");
      clearTodayDailyState();
      dailyResult = null;
    }
  } catch (err) {
    console.warn("Saved state was invalid JSON; resetting daily state", err);
    clearTodayDailyState();
    dailyResult = null;
  }
}

if (parsedSavedState && typeof parsedSavedState === "object") {
  const state = parsedSavedState;
  const hasFinishedResult = state.result === "win" || state.result === "lose";

  if (hasFinishedResult) {
    demoMode = false;
    unlockFreePlay();

    if (currentMode === MODES.DAILY) {
      MAX_GUESSES_OVERRIDE = null;
    }

    gameOver = true;
    gameResult = state.result;
    gameOverDisplaySource = "restored";
    guesses = state.guesses;
    roundGuessHistory = state.guesses.slice();
    lifelineUsed = state.lifelineUsed;
    lifelineGuessIndex = state.lifelineGuessIndex;

    // After rebuild
    if (min > max || secret < min || secret > max) {
      min = MIN_RANGE;
      max = MAX_RANGE;
      guesses = [];
    }

    updateBar();
    updateOrb();
    syncInputRange();

    // Lock gameplay for finished daily state.
    input.disabled = true;
    btn.disabled = true;
    updateShareButton();
    renderGameOverState();
    if (state.result === "win") {
      bar.classList.add("win");
      barFill.classList.add("win");
    }
    tipShown = true;
  } else {
    // Resume in-progress Daily exactly where the player left off.
    demoMode = false;
    currentMode = MODES.DAILY;
    MAX_GUESSES_OVERRIDE = null;
    gameOver = false;
    gameResult = null;
    dailyResult = null;
    guesses = state.guesses;
    roundGuessHistory = state.guesses.slice();
    lifelineUsed = state.lifelineUsed;
    lifelineGuessIndex = state.lifelineGuessIndex;
    min = state.min;
    max = state.max;
    hintAnimating = false;
    hintVisible = false;
    hintAllowed = true;

    bar.className = "bar";
    bar.classList.toggle("hinted", lifelineUsed);
    barFill.className = "bar-fill";
    clearFeedbackMessage();
    tipText.classList.remove("hint");
    tipText.style.display = "none";
    clearTipMessage();
    clearGuessCountMessage();
    input.disabled = false;
    btn.disabled = false;
    updateShareButton();

    // Ensure stale share result key never blocks progress restore.
    localStorage.removeItem(dailyStateKey + "-result");

    updateBar();
    updateOrb();
    syncInputRange();
    updateGuessUI();
  }
}

// Show orb tip for returning players if the game is not over and hint not used
if (!demoMode && !gameOver && !lifelineUsed) {
  maybeShowOrbTip();
}

function persistDailyProgress() {
  if (currentMode !== MODES.DAILY || gameOver) return;

  try {
    localStorage.setItem(
      dailyStateKey,
      JSON.stringify({
        mode: MODES.DAILY,
        result: null,
        guesses: [...guesses],
        lifelineUsed,
        lifelineGuessIndex,
        min,
        max
      })
    );
    localStorage.removeItem(dailyStateKey + "-result");
  } catch (err) {
    console.warn("Failed to persist in-progress daily state", err);
  }
}

/* ---------- HAPTICS ---------- */
function haptic(pattern) {
  if ("vibrate" in navigator) {
    navigator.vibrate(pattern);
  }
}

async function recordGameSession() {
  if (!supabaseClient) return;
  if (!gameStartTime) return;

  const totalGuesses =
    currentMode === MODES.MILLION
      ? millionGuessCounter
      : currentMode === MODES.INVERTED && (gameResult === "win" || gameResult === "lose")
        ? 1
        : guesses.length;

  try {
    await supabaseClient.from("game_sessions").insert({
      user_id: anonUserId,
      mode:
        currentMode === MODES.MICRO
          ? "classic"
          : currentMode,
      won: gameResult === "win",
      guesses: totalGuesses,
      time_ms: Math.max(0, Date.now() - gameStartTime),
      range_history: null,
      perfect_game: gameResult === "win" && totalGuesses === 1
    });
  } catch (err) {
    console.error("Supabase insert failed", err);
  }
}

// ---------- MOBILE AUTO SCROLL ----------
function isMobile() {
  return /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
}

function isIOSDevice() {
  return /iPad|iPhone|iPod/i.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}

function setOrbTrackingTransition(leftSeconds) {
  const duration = Number.isFinite(leftSeconds)
    ? Math.max(0.08, leftSeconds)
    : 0.5;
  const durationText = `${duration.toFixed(3)}s`;

  barOrb.style.transition =
    `left ${durationText} cubic-bezier(0.18, 0.88, 0.26, 1), filter 0.24s ease-out, box-shadow 0.24s ease-out`;

  // iOS + Reduce Motion can collapse transition-duration globally to ~0ms.
  // Force core orb tracking duration so gameplay motion remains readable.
  if (isIOSDevice()) {
    barOrb.style.setProperty(
      "transition-duration",
      `${durationText}, 0.24s, 0.24s`,
      "important"
    );
  }
}

function getViewportHeight() {
  return window.visualViewport?.height || window.innerHeight;
}

let keyboardViewportBaseline = getViewportHeight();

function applyKeyboardInset() {
  const inset = Math.max(0, keyboardViewportBaseline - getViewportHeight());
  document.documentElement.style.setProperty("--keyboard-inset", `${inset}px`);
  return inset;
}

function ensurePlayableSectionVisible(behavior = "smooth") {
  const playable = document.querySelector(".bar-wrap");
  if (!playable) return;

  const viewportHeight = getViewportHeight();
  const rect = playable.getBoundingClientRect();
  const topPadding = 12;
  const bottomPadding = 16;
  const bottomLimit = viewportHeight - bottomPadding;

  if (rect.top >= topPadding && rect.bottom <= bottomLimit) {
    return;
  }

  const targetY =
    window.scrollY +
    rect.top -
    Math.max(topPadding, (viewportHeight - rect.height) * 0.36);

  window.scrollTo({
    top: Math.max(0, targetY),
    behavior
  });
}

function handleKeyboardFocus() {
  if (!isMobile()) return;

  keyboardViewportBaseline = Math.max(keyboardViewportBaseline, getViewportHeight());
  document.body.classList.add("keyboard-open");
  applyKeyboardInset();

  setTimeout(() => {
    applyKeyboardInset();
    ensurePlayableSectionVisible("smooth");
  }, 140);

  setTimeout(() => {
    applyKeyboardInset();
    ensurePlayableSectionVisible("smooth");
  }, 360);
}

function handleKeyboardBlur() {
  document.body.classList.remove("keyboard-open");
  document.documentElement.style.setProperty("--keyboard-inset", "0px");

  if (!isMobile()) return;
  setTimeout(() => {
    keyboardViewportBaseline = getViewportHeight();
  }, 120);
}

if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", () => {
    if (!isMobile()) return;

    if (document.activeElement === input) {
      applyKeyboardInset();
      ensurePlayableSectionVisible("auto");
    } else {
      keyboardViewportBaseline = getViewportHeight();
    }
  });
}

window.addEventListener("orientationchange", () => {
  setTimeout(() => {
    keyboardViewportBaseline = getViewportHeight();

    if (document.activeElement === input && isMobile()) {
      applyKeyboardInset();
      ensurePlayableSectionVisible("auto");
    }
  }, 120);
});

input.addEventListener("focus", () => {
  input.select();

  handleKeyboardFocus();
});

function activateHintOrb() {
  if (!barOrb) return;

  barOrb.classList.add("hint-shine");

  // Remove the class after animation completes
  setTimeout(() => {
    barOrb.classList.remove("hint-shine");
  }, 2700); // 0.9s * 3 cycles
}

function maybeShowOrbTip() {
  if (!gameOver && !lifelineUsed && !tipShown) {
    tipText.classList.remove("hint");
    setTipMessage("followOrbTip");
    tipText.style.opacity = "1";
    tipText.style.display = "block";
    activateHintOrb();
    tipShown = true;
  }
}

/* ---------- FREE PLAY ---------- */
function startFreePlay(mode) {
  Object.keys(sentimentState).forEach(k => sentimentState[k] = false);
  sentimentState.lastGuessHadSentiment = false;
  teardownInvertedInteraction();
  setGuessButtonLabel();
  setOnboardingVisible(false);

  currentMode = mode;
  gameOver = false;
  gameResult = null;
  guesses = [];
  roundGuessHistory = [];
  lastInvertedMiss = null;
  lifelineUsed = false;
  lifelineGuessIndex = null;
  hintAnimating = false;
  hintVisible = false;
  bar.classList.remove("hinted", "hint-ready");
  gameStartTime = Date.now();

  // Hard reset visuals
  bar.className = "bar";
  bar.classList.remove("near");
  barFill.className = "bar-fill";
  barFill.classList.remove("near");
  clearFeedbackMessage();
  clearGuessCountMessage();
  input.disabled = false;
  btn.disabled = false;
  updateShareButton();

   // Hide “Want more Narro? Try Free Play!” once a free play game starts
  const tipText = document.getElementById("tipText");
  if (tipText) {
    tipText.style.display = "none";
    clearTipMessage();
    tipText.classList.remove("hint");
  }

  // Mode-specific setup
  switch (mode) {
    case MODES.CLASSIC:
      min = 1;
      max = 10000;
      MAX_GUESSES_OVERRIDE = 6;
      secret = Math.floor(Math.random() * 10000) + 1;
      hintAllowed = true;
      break;

    case MODES.MILLION:
      min = 1;
      max = 1_000_000;
      MAX_GUESSES_OVERRIDE = Infinity;
      secret = Math.floor(Math.random() * 1_000_000) + 1;
      hintAllowed = false;
      millionGuessCounter = 0;
      break;

    case MODES.MICRO:
      min = 1;
      max = 25;
      MAX_GUESSES_OVERRIDE = 1;
      secret = Math.floor(Math.random() * 25) + 1;
      hintAllowed = false;
      break;

    case MODES.INVERTED:
      min = 1;
      max = INVERTED_MAX_RANGE; // one-shot but still skill-based
      MAX_GUESSES_OVERRIDE = 1;
      secret = Math.floor(Math.random() * (max - min + 1)) + min;
      hintAllowed = false;
      gameOver = false;
      gameResult = null;

      // Reset visuals
      bar.className = "bar inverted-mode";
      barFill.className = "bar-fill";
      barOrb.classList.add("inverted-active");
      barOrb.style.removeProperty("transition-duration");
      input.disabled = true;
      btn.disabled = true;

      // Show secret number (static for the round)
      activeFeedbackMessage = null;
      feedback.textContent = `The secret number is ${secret}`;
      tipText.classList.remove("hint");
      activeTipMessage = null;
      tipText.textContent = "One shot. Drag the orb to the exact number.";
      tipText.style.display = "block";
      tipText.style.opacity = "1";

      minLabel.textContent = min;
      maxLabel.textContent = max;

      // Start centered so it's easy to grab on mobile.
      barOrb.style.transition = "left 0.2s ease";
      barOrb.style.left = "50%";
      barOrb.style.cursor = "grab";

      let placed = false; // enforce one guess

      // One-shot drag interaction (mobile-first pointer flow).
      barOrb.onpointerdown = (e) => {
        if (placed) return;
        e.preventDefault();

        const rect = bar.getBoundingClientRect();
        if (!rect.width) return;

        let activePointerId = e.pointerId;
        barOrb.style.transition = "none";

        const clampX = (clientX) => {
          const raw = clientX - rect.left;
          return Math.max(0, Math.min(rect.width, raw));
        };

        const moveOrbToClientX = (clientX) => {
          const clampedX = clampX(clientX);
          const percent = (clampedX / rect.width) * 100;
          barOrb.style.left = `${percent}%`;
          return clampedX;
        };

        const cleanupListeners = () => {
          window.removeEventListener("pointermove", onDrag);
          window.removeEventListener("pointerup", onDrop);
          window.removeEventListener("pointercancel", onCancel);

          if (activePointerId != null && barOrb.hasPointerCapture?.(activePointerId)) {
            try {
              barOrb.releasePointerCapture(activePointerId);
            } catch {}
          }
          activePointerId = null;
          cleanupInvertedDrag = null;
        };

        const onDrag = (ev) => {
          if (placed || ev.pointerId !== activePointerId) return;
          moveOrbToClientX(ev.clientX);
        };

        const onDrop = (ev) => {
          if (ev.pointerId !== activePointerId) return;
          cleanupListeners();
          if (placed) return;
          placed = true;

          const clampedX = moveOrbToClientX(ev.clientX);
          const rawNumber = min + (clampedX / rect.width) * (max - min);
          const placedNumber = Math.max(min, Math.min(max, Math.round(rawNumber)));
          roundGuessHistory = [placedNumber];
          const snappedPercent = ((placedNumber - min) / (max - min)) * 100;
          barOrb.style.transition = "left 0.16s cubic-bezier(0.22, 1, 0.36, 1)";
          barOrb.style.left = `${snappedPercent}%`;

          gameOver = true;
          const miss = Math.abs(placedNumber - secret);
          lastInvertedMiss = miss;

          if (miss === 0) {
            gameResult = "win";
            feedback.textContent = "🎯 Perfect placement!";
            tipText.classList.remove("hint");
            tipText.textContent = "Perfect. Tap Inverted to play again.";
            bar.classList.add("win");
            barFill.classList.add("win");
            barOrb.classList.add("win-pulse");
            haptic([12, 40, 12]);
          } else if (miss === 1) {
            gameResult = "lose";
            feedback.textContent = `Off by 1. You placed ${placedNumber}. Target was ${secret}.`;
            tipText.classList.remove("hint");
            tipText.textContent = "One away. Tap Inverted to play again.";
            bar.classList.add("near");
            barFill.classList.add("near");
            haptic(10);
          } else {
            gameResult = "lose";
            const quality =
              miss <= 3
                ? `Sharp miss. ${miss} away.`
                : miss <= 10
                  ? `Solid read. ${miss} away.`
                  : `Off by ${miss}.`;

            feedback.textContent = `${quality} You placed ${placedNumber}. Target was ${secret}.`;
            tipText.classList.remove("hint");
            tipText.textContent = "One shot only. Tap Inverted to play again.";
            haptic(miss <= 3 ? [8, 24, 8] : 10);
          }

          // End-round lock
          barOrb.classList.remove("inverted-active");
          barOrb.style.cursor = "default";
          updateShareButton();
          recordGameSession();
        };

        const onCancel = (ev) => {
          if (ev.pointerId !== activePointerId) return;
          cleanupListeners();
          if (!placed) {
            barOrb.style.transition = "left 0.2s ease";
          }
        };

        try {
          barOrb.setPointerCapture(activePointerId);
        } catch {}

        window.addEventListener("pointermove", onDrag);
        window.addEventListener("pointerup", onDrop);
        window.addEventListener("pointercancel", onCancel);
        cleanupInvertedDrag = cleanupListeners;
      };
    break;
    }

  // Common post-switch updates
  syncInputRange();
  updateBar();
  updateOrb();
  updateGuessUI();
  updateMillionGuessDisplay();

  if (currentMode !== MODES.MILLION) {
    document.getElementById("millionPrompt").style.display = "none";
    document.getElementById("millionGuessCounter").style.display = "none";
  }
}

function startDailyMode() {
  // Reset game state, but do NOT touch free play sentimentState
  teardownInvertedInteraction();
  setGuessButtonLabel();
  setOnboardingVisible(false);
  currentMode = MODES.DAILY;
  gameOver = false;
  guesses = [];
  roundGuessHistory = [];
  lastInvertedMiss = null;
  lifelineUsed = false;
  lifelineGuessIndex = null;
  hintAnimating = false;
  hintVisible = false;
  bar.classList.remove("hinted", "hint-ready");
  gameStartTime = Date.now();

  MAX_GUESSES_OVERRIDE = null;
  secret = seededNumber(todayKey);
  min = 1;
  max = 10000;
  hintAllowed = true;

  // Reset visuals
  bar.className = "bar";
  barFill.className = "bar-fill";
  clearFeedbackMessage();
  tipText.classList.remove("hint");
  clearGuessCountMessage();
  input.disabled = false;
  btn.disabled = false;
  updateShareButton();

  updateBar();
  updateOrb();
  syncInputRange();
  updateMillionGuessDisplay(); // hide counter in non-Million modes
}

function resolveFreePlayGuess(g) {
  // MICRO: instant
  if (currentMode === MODES.MICRO) {
    if (g < 1 || g > 25) {
      showToast("Stay in range: 1 to 25.", 2000);
      return; // stop here, don’t end the game
    }

    guesses.push(g);
    roundGuessHistory.push(g);
    if (g === secret) endFreePlayWin();
    else endFreePlayLoss();
    input.disabled = true;
    btn.disabled = true;
    return;
}

  // MILLION: manual handling ONLY
  if (currentMode === MODES.MILLION) {

    // --- INVALID GUESS CHECK ---
    if (g < min || g > max) {
      showToast(`Stay in range: ${min} to ${max}.`, 2000);
      return; // do NOT increment counter or modify range
    }

    // --- VALID GUESS ---
    roundGuessHistory.push(g);
    millionGuessCounter++;
    updateMillionGuessDisplay();

    // Narrow range (NO resolveGuess)
    if (g < secret) min = g + 1;
    else if (g > secret) max = g - 1;

    // Check for win
    if (g === secret || (min === max && !gameOver)) {
      secret = g === secret ? g : min; // ensure secret is correct for auto-win
      endFreePlayWin();  // trigger animation
    } else {
      updateBar();
      updateOrb();
      syncInputRange();
    }

    return;
  }

  // CLASSIC / DAILY
  resolveGuess(g);
}

function triggerWinVisuals() {
  bar.offsetWidth; // force reflow for consistency
  bar.classList.add("win");
  barFill.classList.add("win");
  updateOrb();
  haptic([20, 60, 20]);
}

function endFreePlayWin() {
  gameOver = true;
  gameResult = "win";
  gameOverDisplaySource = "live";
  updateShareButton();
  setFeedbackMessage("bullseye");
  input.disabled = true;
  btn.disabled = true;

  triggerWinVisuals();
  recordGameSession();
}

function endFreePlayLoss() {
  gameOver = true;
  gameResult = "lose";
  gameOverDisplaySource = "live";
  updateShareButton();
  activeFeedbackMessage = null;
  input.disabled = true;
  btn.disabled = true;

  if (currentMode === MODES.MICRO) {
    feedback.textContent = `${getMessage("roundOver")} ${getMessage("numberWas", { value: formatNumber(secret) })}`;
  } else {
    feedback.textContent = getMessage("roundOver");
  }
  gameResult = "lose";
  recordGameSession();
}

function maxGuessesForMode() {
  if (MAX_GUESSES_OVERRIDE != null) return MAX_GUESSES_OVERRIDE;
  switch (currentMode) {
    case MODES.MICRO: return 1;
    case MODES.MILLION: return Infinity;
    case MODES.CLASSIC: return MAX_GUESSES;
    default: return MAX_GUESSES;
  }
}

function getModeRange() {
  switch (currentMode) {
    case MODES.MILLION:
      return { min: 1, max: 1_000_000 };
    case MODES.MICRO:
      return { min: 1, max: 25 };
    case MODES.INVERTED:
      return { min: 1, max: INVERTED_MAX_RANGE };
    default:
      return { min: 1, max: MAX_RANGE }; // daily + classic
  }
}

function updateMillionGuessDisplay() {
  const counter = document.getElementById("millionGuessCounter");
  const prompt = document.getElementById("millionPrompt");
  if (!counter || !prompt) return;

  if (currentMode === MODES.MILLION) {
    prompt.style.display = "block";
    counter.style.display = "block";

    prompt.textContent = "How fast can you solve one million?";
    counter.textContent = `Guesses: ${millionGuessCounter}`;
  } else {
    prompt.style.display = "none";
    counter.style.display = "none";
  }
}

/* ---------- SENTIMENT ---------- */
const sentimentState = {
  inefficiencyShown: false,
  compressionShown: false,
  efficiencyShown: false,
  stakesShown: false,
  superCloseShown: false,
  lastGuessHadSentiment: false
};

function remainingRange() {
  return max - min + 1;
}

function applyWindowSnapHint() {
  const span = max - min + 1;
  if (span <= 2) return false;

  // Target width = 80% of current span
  const targetSpan = Math.max(2, Math.floor(span * 0.8));

  // Quantization step (10% of original span, minimum 5)
  const step = Math.max(5, Math.floor(span * 0.1));

  // Generate all valid snapped windows
  const windows = [];
  for (let start = min; start + targetSpan - 1 <= max; start += step) {
    const end = start + targetSpan - 1;
    if (secret > start && secret < end) {
      windows.push({ start, end });
    }
  }

  // Fallback safety (should never trigger)
  if (!windows.length) return false;

  // Deterministic pick (daily-stable)
  const idx =
    seededNumber(todayKey + "|windowHint") % windows.length;

  let { start, end } = windows[idx];

  // Absolute safety guard: never allow boundary = secret
  const modeRange = getModeRange();

  if (start >= secret) start = secret - 1;
  if (end <= secret) end = secret + 1;

  min = Math.max(modeRange.min, start);
  max = Math.min(modeRange.max, end);

  updateBar();
  updateOrb();
  syncInputRange();
  return true;
}

function guessesRemaining() {
  return maxGuessesForMode() - guesses.length;
}

function suppressSentiment() {
  return (
    demoMode ||
    gameOver ||
    sentimentState.lastGuessHadSentiment ||
    sentimentState.superCloseShown
  );
}

function emitSentiment(text, isCritical=false) {
  // Cancel any pending timeout
  clearTimeout(feedback._fadeT);

  feedback.style.opacity = 0;
  feedback._fadeT = setTimeout(() => {
    feedback.textContent = text;
    if (isCritical) feedback.classList.add("critical");
    else feedback.classList.remove("critical");
    feedback.style.opacity = 1;
  }, 100);

  sentimentState.lastGuessHadSentiment = true;
}

function clearSentiment() {
  clearTimeout(feedback._fadeT);

  feedback.style.opacity = 0;
  feedback._fadeT = setTimeout(() => {
    feedback.textContent = "";
    feedback.classList.remove("critical");
    sentimentState.lastGuessHadSentiment = false;
    feedback.style.opacity = 1;
  }, 50);
}

/* ---------- GAME PHASE ---------- */
function isEarlyGame() {
  return guesses.length <= 2 && remainingRange() > 2000;
}

function isMidGame() {
  return (
    !isEarlyGame() &&
    remainingRange() > 25 &&
    guessesRemaining() > 2
  );
}

function isLateGuessCount() {
  return guesses.length >= maxGuessesForMode() - 2;
}

function isCriticalRange() {
  return remainingRange() <= 25;
}


/* ---------- INPUT RANGE ---------- */
function syncInputRange() {
  if (!input) return;
  if (currentMode === MODES.MICRO) {
    input.min = 1;
    input.max = 25;
  } else {
    input.min = min ?? 1;
    input.max = max ?? MAX_RANGE;
  }
}

/* ---------- RANDOMIZED CONTEXTUAL FEEDBACK ---------- */
const feedbackPhrases = {
  earlyInefficiency: ["Small gain. Cut deeper.","Wide move. Tighten the range.","Good probe. Narrow harder."],
  midCompression: ["Nice. The window is shrinking.","Good pace. Keep narrowing.","You're getting warm."],
  efficientCut: ["Big cut. Great read.","Clean slice. Keep going.","Excellent narrowing."],
  stakes: ["Final stretch. Stay sharp.","Pressure on. Make this one count.","Clutch guess coming up."],
  superClose: ["You're right on it."]
};

function pickPhrase(category) {
  const arr = feedbackPhrases[category] || [];
  return arr[Math.floor(Math.random() * arr.length)];
}

/* ---------- BAR ---------- */
function updateBar() {
  const rangeMax = currentMode === MODES.MILLION ? 1_000_000 :
                   currentMode === MODES.MICRO ? 25 :
                   currentMode === MODES.INVERTED ? INVERTED_MAX_RANGE :
                   MAX_RANGE;

  // Clamp min/max to valid range
  min = Math.min(Math.max(1, min), rangeMax);
  max = Math.min(Math.max(min, max), rangeMax);

  // Use (rangeMax - 1) for full scale mapping
  const left = ((min - 1) / (rangeMax - 1)) * 100;
  const width = ((max - min + 1) / (rangeMax - 1)) * 100;
  const slow = isLateGuessCount();

  if (!hintAnimating) {
    barFill.style.transition = slow
      ? "left 0.6s ease, width 0.6s ease"
      : "left 0.35s ease, width 0.35s ease";
  }

  barFill.style.left = left + "%";
  barFill.style.width = width + "%";

  const remainingRatio = (max - min + 1) / rangeMax;
  bar.classList.toggle("tight-range", !gameOver && remainingRatio <= 0.12);

  if (remainingRatio <= 0.45) {
    bar.classList.add("no-brackets");
  } else {
    bar.classList.remove("no-brackets");
  }

  bar.style.position = "relative";

  // Always-visible labels
  minLabel.style.display = "inline";
  maxLabel.style.display = "inline";

  minLabel.textContent = min.toLocaleString();
  maxLabel.textContent = max.toLocaleString();
  bar.setAttribute(
    "aria-label",
    `Remaining possible range: ${min.toLocaleString()} to ${max.toLocaleString()}`
  );

  const centerLabel = bar.querySelector(".center-range-label");
  if (centerLabel) centerLabel.remove();

  if (!gameOver && min === max) {
    if (min === secret) {
        win();
    } else if (currentMode === MODES.DAILY && guessesRemaining() === 0) {
        // Only auto-lose if player has no guesses left
        lose();
    }
}

  bar.style.setProperty("--fill-left", left + "%");
  bar.style.setProperty("--fill-width", Math.max(width, 0) + "%");

  updateOrb();
}

function resolveGuess(g, skipPush = false) {
  // --- 0. Reject guesses outside the current visible range ---
  if (g < min || g > max) {
    showToast(`Stay in range: ${min} to ${max}.`);
    haptic(5);
    return; // exit early — no state changes
  }

  const prevMin = min;
  const prevMax = max;
  const prevRange = prevMax - prevMin + 1;

  if (!skipPush && currentMode !== MODES.MILLION) {
    guesses.push(g); // do not push in Million mode
    roundGuessHistory.push(g);
  }
  haptic(10);

  // --- 1. Check win/lose ---
  if (g === secret) {
  if (currentMode === MODES.DAILY || currentMode === MODES.CLASSIC) {
    win();
    updateGuessUI();
  }
  return;
}

  if (guesses.length >= maxGuessesForMode()) {
    lose();
    updateGuessUI();
    return;
  }

  // --- 2. Update range ---
  if (g < secret) {
    min = g + 1;
  } else if (g > secret) {
    max = g - 1;
  }

  updateBar();
  updateOrb();
  syncInputRange();

  // --- 3. Micro reward for efficient cut ---
  const newRange = max - min + 1;
  if (newRange / prevRange <= 0.6 && isMidGame()) microReward("efficient");

  // --- 4. Evaluate sentiment ---
  if (!suppressSentiment()) {
    let sentimentToShow = null;
    let isCritical = false;
    const reduction = 1 - newRange / prevRange;

    if (isEarlyGame() && !sentimentState.inefficiencyShown && reduction < 0.10) {
      if (Math.random() > 0.25) sentimentToShow = pickPhrase("earlyInefficiency");
      sentimentState.inefficiencyShown = true;
    } else if (isMidGame() && !sentimentState.compressionShown && newRange <= 2000) {
      sentimentToShow = pickPhrase("midCompression");
      sentimentState.compressionShown = true;
    } else if (isMidGame() && !sentimentState.efficiencyShown && reduction >= 0.40) {
      sentimentToShow = pickPhrase("efficientCut");
      sentimentState.efficiencyShown = true;
    } else if (isMidGame() && !sentimentState.stakesShown && guessesRemaining() <= 3) {
      sentimentToShow = pickPhrase("stakes");
      sentimentState.stakesShown = true;
    } else if (isCriticalRange() && !sentimentState.superCloseShown && newRange <= 25) {
      sentimentToShow = pickPhrase("superClose");
      sentimentState.superCloseShown = true;
      isCritical = true;
    }

    if (sentimentToShow) emitSentiment(sentimentToShow, isCritical);

    if (currentMode === MODES.MILLION) {
      millionGuessCounter++;
      updateMillionGuessDisplay();
    }

  }

  // --- 5. Update guess UI ---
  if (currentMode === MODES.DAILY && !gameOver) {
    persistDailyProgress();
  }

  if (!gameOver) {
    updateGuessUI();
  }
}

function updateGuessUI() {
  feedback.style.opacity = 1;

  if (gameOver) {
    clearGuessCountMessage();
    bar.classList.remove("hint-ready");
    tipText.classList.remove("hint");
    return;
  }

  const remaining = maxGuessesForMode() - guesses.length;

  if (currentMode === MODES.INVERTED) {
    clearGuessCountMessage();
    bar.classList.remove("hint-ready");
    tipText.classList.remove("hint");
    activeTipMessage = null;
    tipText.textContent = "One shot. Drag the orb to the exact number.";
    tipText.style.display = "block";
    tipText.style.opacity = "1";
    return;
  }

  if (currentMode !== MODES.DAILY && currentMode !== MODES.CLASSIC) {
    bar.classList.remove("hint-ready");
    tipText.style.display = "none";
    activeGuessCountMessage = null;
    activeTipMessage = null;
    return;
  }

  if (!hintAllowed) {
    bar.classList.remove("hint-ready", "hinted");
    tipText.style.display = "none";
    activeGuessCountMessage = null;
    activeTipMessage = null;
    return;
  }

  if (remaining > 1) {
    setGuessCountMessage("guessesLeft", { count: remaining });
    guessCount.style.color = "var(--muted)";
  } else if (remaining === 1) {
    setGuessCountMessage("finalGuess");
    guessCount.style.color = "var(--accent)";
    guessCount.style.fontWeight = "600";
  } else {
    clearGuessCountMessage();
  }

  if (
    !gameOver &&
    guesses.length === maxGuessesForMode() - 2 &&
    !lifelineUsed
  ) {
    bar.classList.add("hint-ready");
    setTipMessage("hintPrompt");
    tipText.classList.add("hint");
    tipText.style.display = "block";
    tipText.style.opacity = "1";
  } else {
    bar.classList.remove("hint-ready");
    tipText.classList.remove("hint");
    if (activeTipMessage?.key === "hintPrompt") {
      activeTipMessage = null;
    }
  }
}

function microReward(type) {
  if (type === "efficient") {
    barOrb.classList.remove("reward-flash");
    barOrb.offsetWidth; // restart animation
    barOrb.classList.add("reward-flash");
    setTimeout(() => barOrb.classList.remove("reward-flash"), 500);
  } else if (type === "streak") {
    const el = document.getElementById("streak");
    el.style.transition = "transform 0.3s ease";
    el.style.transform = "scale(1.15)";
    setTimeout(() => el.style.transform = "scale(1)", 400);
  }
}

/* ---------- GUESS ---------- */
function submitCurrentGuess() {
  if (gameOver) return;

  const g = Number(input.value);

  if (Number.isNaN(g) || g < min || g > max) {
    showToast("Enter a number in the current range.");
    return;
  }

  if (demoRunning) {
    handleDemoGuess(g);
    return;
  }

  if (demoMode) {
    dismissDemoPromptForLiveGame();
  }

  if (!gameOver && guesses.length === maxGuessesForMode() - 2) {
  tipText.style.opacity = 0;
  }

  input.value = "";

  if (currentMode === MODES.DAILY || currentMode === MODES.CLASSIC) {
  resolveGuess(g);
} else {
  resolveFreePlayGuess(g);
}

  if (!gameOver) {
    if (isMobile()) {
      setTimeout(() => {
        if (gameOver) return;
        try {
          input.focus({ preventScroll: true });
        } catch {
          input.focus();
        }
      }, 0);
    } else {
      input.focus();
    }
  }

}

let suppressNextGuessClick = false;
let activeMobileGuessPointerId = null;
const GUESS_BUTTON_SLOP_PX = 18;

btn.addEventListener("pointerdown", (e) => {
  if (!isMobile() || e.pointerType === "mouse" || btn.disabled) return;
  e.preventDefault();
  activeMobileGuessPointerId = e.pointerId;
  try {
    btn.setPointerCapture(e.pointerId);
  } catch {}
});

btn.addEventListener("pointercancel", (e) => {
  if (e.pointerId === activeMobileGuessPointerId) {
    activeMobileGuessPointerId = null;
  }
});

btn.addEventListener("pointerup", (e) => {
  if (!isMobile() || e.pointerType === "mouse" || btn.disabled) return;
  if (e.pointerId !== activeMobileGuessPointerId) return;
  activeMobileGuessPointerId = null;

  const rect = btn.getBoundingClientRect();
  const withinExpandedBounds =
    e.clientX >= rect.left - GUESS_BUTTON_SLOP_PX &&
    e.clientX <= rect.right + GUESS_BUTTON_SLOP_PX &&
    e.clientY >= rect.top - GUESS_BUTTON_SLOP_PX &&
    e.clientY <= rect.bottom + GUESS_BUTTON_SLOP_PX;

  if (!withinExpandedBounds) return;
  e.preventDefault();
  suppressNextGuessClick = true;
  submitCurrentGuess();
});

btn.addEventListener("click", (e) => {
  if (suppressNextGuessClick) {
    suppressNextGuessClick = false;
    e.preventDefault();
    return;
  }
  submitCurrentGuess();
});

/* ---------- SHRINK HINT ---------- */
bar.onclick = () => {
  if (lifelineUsed || gameOver) return;
  if (guesses.length !== maxGuessesForMode() - 2) return;
  if (
  currentMode === MODES.MILLION ||
  currentMode === MODES.MICRO
) return;

  const hintApplied = applyWindowSnapHint();
  if (!hintApplied) {
    showToast("Hint unavailable at this range.", 1800);
    haptic(6);
    return;
  }

  lifelineUsed = true;
  lifelineGuessIndex = guesses.length;
  hintVisible = true;

  tipText.classList.remove("hint");
  setTipMessage("rangeTightened");
  tipText.style.opacity = "1";

  bar.classList.remove("hint-ready");
  bar.classList.add("hinted");

  if (currentMode === MODES.DAILY) {
    persistDailyProgress();
  }

  haptic([6, 30, 6]);
};

function updateOrb() {
  if (!barOrb) return;

  // Inverted mode controls orb position manually (edge start + drag).
  // Keep visual style synced, but never auto-snap to the secret while active.
  if (currentMode === MODES.INVERTED && !gameOver) {
    barOrb.style.background =
      "radial-gradient(circle at 30% 30%, rgba(108,242,194,0.95), rgba(72,210,160,1))";
    barOrb.style.boxShadow =
      "0 0 10px rgba(108,242,194,0.45), inset 0 1px 2px rgba(255,255,255,0.4)";
    barOrb.classList.remove("win-pulse");
    return;
  }

  // On game over, normalize range for clarity (DAILY only)
  if (gameOver && currentMode === MODES.DAILY) {
    min = MIN_RANGE;
    max = MAX_RANGE;

    minLabel.textContent = min;
    maxLabel.textContent = max;
  }

  let percent;

  // 🔧 Determine authoritative normalization bounds
  const modeRange = getModeRange();
  const rangeMin = modeRange.min;
  const rangeMax = modeRange.max;

// Clamp min/max to valid range
min = Math.min(Math.max(rangeMin, min), rangeMax);
max = Math.max(min, Math.min(max, rangeMax));

  if (gameOver || min === max) {
    // Always point directly to the secret number (mode-correct)
    percent = ((secret - rangeMin) / (rangeMax - rangeMin)) * 100;
  } else {
    percent = ((secret - min) / (max - min)) * 100;
  }

  percent = Math.min(100, Math.max(0, percent));
  const previousPercent = Number.parseFloat(barOrb.style.left);
  const deltaPercent = Number.isFinite(previousPercent)
    ? Math.abs(percent - previousPercent)
    : 0;
  const travelDuration = Number.isFinite(deltaPercent)
    ? Math.min(0.64, Math.max(0.3, 0.3 + deltaPercent * 0.0044))
    : 0.42;

  setOrbTrackingTransition(travelDuration);
  const nextLeft = `${percent}%`;
  if (orbMoveRaf != null) {
    cancelAnimationFrame(orbMoveRaf);
    orbMoveRaf = null;
  }

  if (isMobile()) {
    orbMoveRaf = requestAnimationFrame(() => {
      barOrb.style.left = nextLeft;
      orbMoveRaf = null;
    });
  } else {
    barOrb.style.left = nextLeft;
  }

  if (
    !gameOver &&
    deltaPercent >= 0.4 &&
    !window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches
  ) {
    barOrb.classList.remove("orb-moving");
    barOrb.offsetWidth; // restart pulse
    barOrb.classList.add("orb-moving");
    clearTimeout(orbMovePulseTimer);
    orbMovePulseTimer = setTimeout(() => {
      barOrb.classList.remove("orb-moving");
    }, 220);
  }

  // Glow & pulse effect
  if (gameOver) {
    barOrb.style.background =
      "radial-gradient(circle at 30% 30%, rgba(255, 223, 100, 0.95), rgba(255, 200, 50, 1))";
    barOrb.style.boxShadow =
      "0 0 14px rgba(255, 223, 100, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.4)";
    barOrb.classList.add("win-pulse");
  } else {
    barOrb.style.background =
      "radial-gradient(circle at 30% 30%, rgba(108,242,194,0.95), rgba(72,210,160,1))";
    barOrb.style.boxShadow =
      "0 0 10px rgba(108,242,194,0.45), inset 0 1px 2px rgba(255,255,255,0.4)";
    barOrb.classList.remove("win-pulse");
  }
}

function showToast(msg, duration = 1400) {
  toast.textContent = msg;
  toast.style.opacity = 1;

  clearTimeout(toast._t);
  toast._t = setTimeout(() => {
    toast.style.opacity = 0;
  }, duration);
}

/* ---------- END STATES ---------- */
function win() {
  if (currentMode !== MODES.DAILY && currentMode !== MODES.CLASSIC) return;
  if (gameOver) return;
  const isDailyGame = currentMode === MODES.DAILY;

  // --- GA4 tracking ---
  if (typeof gtag === "function") {
    gtag("event", "game_win", {
      guesses: guesses.length,
      hint_used: lifelineUsed,
      game_version: "v1.0"
    });
  }

  gameOver = true;
  gameResult = "win";
  gameOverDisplaySource = "live";

  // Disable input & buttons
  input.disabled = true;
  btn.disabled = true;
  updateShareButton();

  // --- Store daily result ---
  if (isDailyGame) {
    localStorage.setItem(dailyStateKey, JSON.stringify({
      result: "win",
      guesses,
      lifelineUsed,
      lifelineGuessIndex,
      mode: currentMode
    }));
    localStorage.setItem(dailyStateKey + "-result", "win");
    dailyResult = "win";
  }

  // --- Unlock Free Play (Daily only) ---
  if (isDailyGame) unlockFreePlay();

  // --- Update UI ---
  clearGuessCountMessage();
  bar.classList.remove("hinted", "hint-ready");
  renderGameOverState();

  // --- Celebration ---
  launchConfetti();
  haptic([20, 60, 20]);

  if (isDailyGame) {
    updateStats(true);
  }

  // --- WIN STREAK ---
  if (isDailyGame) {
    const etNow = new Date(new Date().toLocaleString("en-US", { timeZone: "America/New_York" }));
    const etYesterday = new Date(etNow);
    etYesterday.setDate(etYesterday.getDate() - 1);

    const yesterdayKey = `${etYesterday.getFullYear()}-${String(etYesterday.getMonth()+1).padStart(2,"0")}-${String(etYesterday.getDate()).padStart(2,"0")}`;
    const prevStreak = Number(localStorage.getItem("narroStreakPrev")) || 0;

    const streak = localStorage.getItem("narroLastPlayed") === yesterdayKey
      ? prevStreak + 1
      : 1;

    localStorage.setItem("narroStreakPrev", streak);
    localStorage.setItem("narroLastPlayed", todayKey);
    setStreakText(streak);
  }

  triggerWinVisuals();

  // --- Record session ---
  recordGameSession();
}

function lose() {
  if (currentMode !== MODES.DAILY && currentMode !== MODES.CLASSIC) return;
  if (gameOver) return;
  const isDailyGame = currentMode === MODES.DAILY;

  // --- GA4 tracking ---
  if (typeof gtag === "function") {
    gtag("event", "game_loss", {
      guesses: guesses.length,
      hint_used: lifelineUsed,
      game_version: "v1.0"
    });
  }

  gameOver = true;
  gameResult = "lose";
  gameOverDisplaySource = "live";

  // --- Store daily result ---
  if (isDailyGame) {
    localStorage.setItem(dailyStateKey, JSON.stringify({
      result: "lose",
      guesses,
      lifelineUsed,
      lifelineGuessIndex,
      mode: currentMode
    }));
    localStorage.setItem(dailyStateKey + "-result", "lose");
    dailyResult = "lose";
  }

  // --- Unlock Free Play (Daily only) ---
  if (isDailyGame) {
    unlockFreePlay();
  }

  clearGuessCountMessage();
  haptic(15);
  renderGameOverState();

  input.disabled = true;
  btn.disabled = true;
  updateShareButton();

  if (isDailyGame) {
    updateStats(false);
  }

  // --- Record session ---
  recordGameSession();
}

function getClosestDistance() {
  if (!guesses.length) return null;

  return guesses.reduce((minDist, g) => {
    const d = Math.abs(Number(g) - secret);
    return Number.isFinite(d) ? Math.min(minDist, d) : minDist;
  }, Infinity);
}

/* ---------- CONFETTI ---------- */
function launchConfetti() {
  const confetti = document.getElementById("confetti");  
  const ctx = confetti.getContext("2d");
  confetti.width = innerWidth; confetti.height = innerHeight;
  const pieces = Array.from({ length: 120 }, () => ({
    x: Math.random() * confetti.width,
    y: -20,
    vx: (Math.random() - 0.5) * 4,
    vy: Math.random() * 0.005 * innerHeight + 0.0025 * innerHeight,
    size: 6,
    color: `hsl(${Math.random() * 360},100%,70%)`
  }));

  function frame() {
    ctx.clearRect(0,0,confetti.width,confetti.height);
    pieces.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if (p.y < confetti.height) {
        ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size);
      }
    });
    if (pieces.some(p => p.y < confetti.height)) requestAnimationFrame(frame);
  }
  frame();
}

/* ---------- STATS ---------- */
const DEFAULT_STATS = { games: 0, wins: 0, totalGuesses: 0, best: 99 };
let stats = { ...DEFAULT_STATS };

try {
  const rawStats = localStorage.getItem("narroStats");
  if (rawStats) {
    const parsedStats = JSON.parse(rawStats);
    if (parsedStats && typeof parsedStats === "object") {
      stats = {
        games: Number(parsedStats.games) || 0,
        wins: Number(parsedStats.wins) || 0,
        totalGuesses: Number(parsedStats.totalGuesses) || 0,
        best: Number(parsedStats.best) || 99
      };
    }
  }
} catch (err) {
  console.warn("Failed to parse narroStats; using defaults", err);
}

const playedKey = `narroPlayed-${todayKey}`;

function updateStats(win) {
  if (localStorage.getItem(playedKey)) return;

  stats.games++;

  if (win) {
    stats.wins++;
    stats.totalGuesses += guesses.length;
    stats.best = Math.min(stats.best, guesses.length);
  }

  localStorage.setItem("narroStats", JSON.stringify(stats));
  localStorage.setItem(playedKey, "true");
}

let lastFocusedBeforeStatsModal = null;

function openStatsModal() {
  lastFocusedBeforeStatsModal = document.activeElement;
  statsModal.style.display = "flex";
  refreshStatsModalContent();
  statsCloseBtn?.focus();
}

function closeStatsModal() {
  statsModal.style.display = "none";
  if (lastFocusedBeforeStatsModal && typeof lastFocusedBeforeStatsModal.focus === "function") {
    lastFocusedBeforeStatsModal.focus();
  } else {
    statsBtn.focus();
  }
}

statsBtn.onclick = openStatsModal;

statsBtn.addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === " ") {
    e.preventDefault();
    openStatsModal();
  }
});

statsCloseBtn?.addEventListener("click", closeStatsModal);

statsModal.addEventListener("click", (e) => {
  if (e.target === statsModal) {
    closeStatsModal();
  }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && languageMenu && !languageMenu.hidden) {
    closeLanguageMenu({ restoreFocus: true });
    return;
  }
  if (e.key === "Escape" && statsModal.style.display === "flex") {
    closeStatsModal();
  }
});

/* ---------- SHARE ---------- */
function getFreePlayModeLabel() {
  switch (currentMode) {
    case MODES.CLASSIC:
      return "Classic";
    case MODES.MILLION:
      return "Million";
    case MODES.MICRO:
      return "Micro";
    case MODES.INVERTED:
      return "Inverted";
    default:
      return "Run";
  }
}

function getShareGuessSeries() {
  if (currentMode === MODES.MILLION || currentMode === MODES.INVERTED) {
    return roundGuessHistory.slice();
  }
  return guesses.length ? guesses.slice() : roundGuessHistory.slice();
}

function formatGuessCount(n) {
  return `${n} guess${n === 1 ? "" : "es"}`;
}

function getFreePlayChallengeLine() {
  switch (currentMode) {
    case MODES.CLASSIC:
      return "Can you beat this in fewer guesses?";
    case MODES.MILLION:
      return "Can you solve Million faster?";
    case MODES.MICRO:
      return "Can you hit Micro in one shot?";
    case MODES.INVERTED:
      return "Can you place the orb exactly?";
    default:
      return "Can you beat this run?";
  }
}

function buildShareTiles(shareGuesses, result) {
  const won = result === "win";
  const lost = result === "lose";
  const tiles = [];
  const { min: modeMin, max: modeMax } = getModeRange();
  const modeSpan = Math.max(1, modeMax - modeMin + 1);

  // Normalize heat bands by mode size so tiles represent comparable skill
  // across Daily/Classic/Million/Micro.
  const veryCloseFloor = currentMode === MODES.MICRO ? 1 : 2;
  const VERY_CLOSE_MAX = Math.max(
    veryCloseFloor,
    Math.round(modeSpan * 0.012) // ~1.2%
  );
  const gettingCloseFloor = currentMode === MODES.MICRO ? 3 : VERY_CLOSE_MAX + 1;
  const GETTING_CLOSE_MAX = Math.max(
    gettingCloseFloor,
    Math.round(modeSpan * 0.08) // ~8%
  );

  let closestDistance = null;
  if (lost && shareGuesses.length) {
    closestDistance = shareGuesses.reduce((minDist, g) => {
      const num = Number(g);
      if (!Number.isFinite(num)) return minDist;
      return Math.min(minDist, Math.abs(num - secret));
    }, Infinity);
    if (!Number.isFinite(closestDistance)) closestDistance = null;
  }

  for (let i = 0; i < shareGuesses.length; i++) {
    const num = Number(shareGuesses[i]);
    const isWinningGuess = num === secret;
    const isFinalLossGuess = lost && i === shareGuesses.length - 1;
    let tile;

    if (isWinningGuess) {
      tile = "🎯";
    } else if (isFinalLossGuess) {
      tile = "❌";
    } else if (!Number.isFinite(num)) {
      tile = "❔";
    } else {
      const distance = Math.abs(num - secret);
      if (distance <= VERY_CLOSE_MAX) {
        tile = "🔥";
      } else if (distance <= GETTING_CLOSE_MAX) {
        tile = "🌡️";
      } else {
        tile = "🧊";
      }
    }

    if (lifelineUsed && lifelineGuessIndex === i) {
      tile += "🛟";
    }

    tiles.push(tile);

    if (isWinningGuess || isFinalLossGuess) {
      break;
    }
  }

  if (won && !tiles.some(tile => tile.includes("🎯"))) {
    tiles.push("🎯");
  }

  return { tiles, closestDistance };
}

function generateShareText() {
  const resolvedResult =
    gameResult === "win" || gameResult === "lose"
      ? gameResult
      : (currentMode === MODES.DAILY &&
          (dailyResult === "win" || dailyResult === "lose"))
        ? dailyResult
        : null;
  const won = resolvedResult === "win";
  const lost = resolvedResult === "lose";
  const shareGuesses = getShareGuessSeries();
  const { tiles, closestDistance } = buildShareTiles(shareGuesses, resolvedResult);
  const tileLine = tiles.join(" ") || (won ? "🎯" : lost ? "❌" : "❔");

  if (currentMode === MODES.DAILY) {
    const solvedGuesses = guesses.length || shareGuesses.length;
    const infoLine = won
      ? `Solved in ${formatGuessCount(solvedGuesses)}.`
      : lost && closestDistance != null
        ? `Closest: ${closestDistance} away.`
        : "Result unavailable.";

    return (
      `Narro · ${todayKey}\n\n` +
      `${tileLine}\n` +
      `${infoLine}\n\n` +
      `${CANONICAL_URL}`
    );
  }

  let infoLine;
  if (currentMode === MODES.INVERTED) {
    if (won) {
      infoLine = "Perfect placement.";
    } else if (Number.isFinite(lastInvertedMiss)) {
      infoLine = `Missed by ${lastInvertedMiss}.`;
    } else {
      infoLine = "One shot missed.";
    }
  } else if (currentMode === MODES.MILLION) {
    infoLine = won
      ? `Solved Million in ${formatGuessCount(millionGuessCounter)}.`
      : `Run complete in ${formatGuessCount(millionGuessCounter)}.`;
  } else if (currentMode === MODES.MICRO) {
    infoLine = won
      ? "Bullseye in one."
      : lost && closestDistance != null
        ? `Missed by ${closestDistance}.`
        : "Round complete.";
  } else {
    infoLine = won
      ? `Solved in ${formatGuessCount(shareGuesses.length)}.`
      : lost && closestDistance != null
        ? `Closest: ${closestDistance} away.`
        : "Round complete.";
  }

  const lifelineLine =
    currentMode === MODES.CLASSIC
      ? (lifelineUsed ? "Hint used." : "No hint used.")
      : null;
  const challengeLine = getFreePlayChallengeLine();

  return (
    `Narro Free Play · ${getFreePlayModeLabel()}\n\n` +
    `${tileLine}\n` +
    `${infoLine}\n` +
    `${lifelineLine ? `${lifelineLine}\n` : ""}` +
    `${challengeLine}\n\n` +
    `${CANONICAL_URL}`
  );
}

shareBtn.onclick = async () => {
  const text = generateShareText();
  const shareTitle = currentMode === MODES.DAILY
    ? "Narro"
    : `Narro Free Play · ${getFreePlayModeLabel()}`;

  try {
    if (navigator.share) {
      await navigator.share({
        title: shareTitle,
        text
      });
    } else {
      await navigator.clipboard.writeText(text);
      showToast("Result copied.");
    }
  } catch {
    showToast("Couldn't share, result copied.");
    try {
      await navigator.clipboard.writeText(text);
    } catch {}
  }
};

/* ---------- COUNTDOWN ---------- */
updateCountdownText();
setInterval(updateCountdownText, 1000);

syncInputRange();
updateBar();

if (!gameOver && !parsedSavedState) {
  updateGuessUI();
}

// Final safety: if the game is active, input must remain enabled.
if (!gameOver && !demoMode) {
  input.disabled = false;
  btn.disabled = false;
}

if (demoMode) {
  runFirstTimeDemo();
}

document.getElementById("feedbackBtn")?.addEventListener("click", (e) => {
  e.preventDefault();
  e.stopPropagation();
  window.open(buildFeedbackURL(), "_blank", "noopener");
});

</script>

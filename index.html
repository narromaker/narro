}

function buildShareTiles(shareGuesses, result) {
  const won = result === "win";
  const lost = result === "lose";
  const tiles = [];
  const { min: modeMin, max: modeMax } = getModeRange();
  const modeSpan = Math.max(1, modeMax - modeMin + 1);

  // Normalize heat bands by mode size so tiles represent comparable skill
  // across Daily/Classic/Million/Micro.
  const veryCloseFloor = currentMode === MODES.MICRO ? 1 : 2;
  const VERY_CLOSE_MAX = Math.max(
    veryCloseFloor,
    Math.round(modeSpan * 0.012) // ~1.2%
  );
  const gettingCloseFloor = currentMode === MODES.MICRO ? 3 : VERY_CLOSE_MAX + 1;
  const GETTING_CLOSE_MAX = Math.max(
    gettingCloseFloor,
    Math.round(modeSpan * 0.08) // ~8%
  );

  let closestDistance = null;
  if (lost && shareGuesses.length) {
    closestDistance = shareGuesses.reduce((minDist, g) => {
      const num = Number(g);
      if (!Number.isFinite(num)) return minDist;
      return Math.min(minDist, Math.abs(num - secret));
    }, Infinity);
    if (!Number.isFinite(closestDistance)) closestDistance = null;
  }

  for (let i = 0; i < shareGuesses.length; i++) {
    const num = Number(shareGuesses[i]);
    const isWinningGuess = num === secret;
    const isFinalLossGuess = lost && i === shareGuesses.length - 1;
    let tile;

    if (isWinningGuess) {
      tile = "🎯";
    } else if (isFinalLossGuess) {
      tile = "❌";
    } else if (!Number.isFinite(num)) {
      tile = "❔";
    } else {
      const distance = Math.abs(num - secret);
      if (distance <= VERY_CLOSE_MAX) {
        tile = "🔥";
      } else if (distance <= GETTING_CLOSE_MAX) {
        tile = "🌡️";
      } else {
        tile = "🧊";
      }
    }

    if (lifelineUsed && lifelineGuessIndex === i) {
      tile += "🛟";
    }

    tiles.push(tile);

    if (isWinningGuess || isFinalLossGuess) {
      break;
    }
  }

  if (won && !tiles.some(tile => tile.includes("🎯"))) {
    tiles.push("🎯");
  }

  return { tiles, closestDistance };
}

function generateShareText() {
  const resolvedResult =
    gameResult === "win" || gameResult === "lose"
      ? gameResult
      : (currentMode === MODES.DAILY &&
          (dailyResult === "win" || dailyResult === "lose"))
        ? dailyResult
        : null;
  const won = resolvedResult === "win";
  const lost = resolvedResult === "lose";
  const shareGuesses = getShareGuessSeries();
  const { tiles, closestDistance } = buildShareTiles(shareGuesses, resolvedResult);
  const tileLine = tiles.join(" ") || (won ? "🎯" : lost ? "❌" : "❔");

  if (currentMode === MODES.DAILY) {
    const solvedGuesses = guesses.length || shareGuesses.length;
    const infoLine = won
      ? getMessage("shareSolvedIn", { guessCount: formatGuessCount(solvedGuesses) })
      : lost && closestDistance != null
        ? getMessage("shareClosestAway", { distance: formatNumber(closestDistance) })
        : getMessage("shareResultUnavailable");

    return (
      `Narro · ${todayKey}\n\n` +
      `${tileLine}\n` +
      `${infoLine}\n\n` +
      `${CANONICAL_URL}`
    );
  }

  let infoLine;
  if (currentMode === MODES.INVERTED) {
    if (won) {
      infoLine = getMessage("sharePerfectPlacement");
    } else if (Number.isFinite(lastInvertedMiss)) {
      infoLine = getMessage("shareMissedBy", { distance: formatNumber(lastInvertedMiss) });
    } else {
      infoLine = getMessage("shareOneShotMissed");
    }
  } else if (currentMode === MODES.MILLION) {
    infoLine = won
      ? getMessage("shareSolvedIn", { guessCount: formatGuessCount(millionGuessCounter) })
      : getMessage("shareRunCompleteIn", { guessCount: formatGuessCount(millionGuessCounter) });
  } else if (currentMode === MODES.MICRO) {
    infoLine = won
      ? getMessage("shareBullseyeInOne")
      : lost && closestDistance != null
        ? getMessage("shareMissedBy", { distance: formatNumber(closestDistance) })
        : getMessage("shareRoundComplete");
  } else {
    infoLine = won
      ? getMessage("shareSolvedIn", { guessCount: formatGuessCount(shareGuesses.length) })
      : lost && closestDistance != null
        ? getMessage("shareClosestAway", { distance: formatNumber(closestDistance) })
        : getMessage("shareRoundComplete");
  }

  const lifelineLine =
    currentMode === MODES.CLASSIC
      ? (lifelineUsed ? getMessage("shareHintUsed") : getMessage("shareNoHintUsed"))
      : null;
  const challengeLine = getFreePlayChallengeLine();

  return (
    `${getFreePlayShareTitle()}\n\n` +
      `${tileLine}\n` +
      `${infoLine}\n` +
      `${lifelineLine ? `${lifelineLine}\n` : ""}` +
    `${challengeLine}\n\n` +
    `${CANONICAL_URL}`
  );
}

shareBtn.onclick = async () => {
  const shareContext = roundContextVersion;
  const text = generateShareText();
  const shareTitle = currentMode === MODES.DAILY
    ? "Narro"
    : getFreePlayShareTitle();

  try {
    if (navigator.share) {
      await navigator.share({

      });
    } else {
      await navigator.clipboard.writeText(text);
      if (shareContext === roundContextVersion) showToast(getMessage("shareResultCopied"));
    }
  } catch {
    try {
      await navigator.clipboard.writeText(text);
      if (shareContext === roundContextVersion) showToast(getMessage("shareFallbackCopied"));
    } catch {
      if (shareContext === roundContextVersion) showToast(getMessage("shareCopyFailed"), 2400);
    }
  }
};

  message.textContent = !message.hidden ? getMessage(challengeMessageKey) : '';
  message.dataset.error = String(challengeMessageError);
}
function renderDailyChallenge() {
  renderChallengeComposer();
  const panel = document.getElementById('challengePanel');
  panel.hidden = currentMode !== MODES.DAILY || (!dailyChallenge && !challengeStatusKey);
  const comparison = document.getElementById('challengeVerdict');
  const scores = document.getElementById('challengeScores');
  const recipientColumn = document.getElementById('recipientScoreColumn');
  comparison.hidden = true; comparison.textContent = '';
  scores.hidden = true; recipientColumn.hidden = true;
  for (const id of ['challengeHeading', 'challengeStatus', 'challengerName', 'challengerScore', 'recipientName', 'recipientScore']) document.getElementById(id).textContent = '';
  document.getElementById('challengeCompareBtn').hidden = true;
  document.getElementById('challengeRetryBtn').hidden = true;
  document.getElementById('challengeTodayBtn').hidden = true;
  if (panel.hidden) return;
  document.getElementById('challengeHeading').textContent = getMessage('challengeFriend');
  const challenge = dailyChallenge?.metadata;
  let status = challengeStatusKey;
  if (challenge && !status) {
    const classification = classifyChallenge(challenge, challengePuzzleDate());
    status = { expired_challenge: 'challengeExpired', future_challenge: 'challengeFuture', incompatible_rules: 'challengeIncompatible' }[classification];
    if (!status && challenge.puzzleDate !== todayKey) status = 'challengeExpired';
  }
  if (status) {
    document.getElementById('challengeStatus').textContent = getMessage(status);
    document.getElementById('challengeTodayBtn').hidden = status === 'challengeLoading';
    document.getElementById('challengeTodayBtn').textContent = getMessage('playToday');
    document.getElementById('challengeRetryBtn').hidden = status !== 'challengeUnavailable' || !dailyChallenge;
    document.getElementById('challengeRetryBtn').textContent = getMessage('retryChallenge');
    return;
  }
  if (!challenge) return;
  document.getElementById('challengeHeading').textContent = getMessage('challengeFrom', { name: challenge.nickname });
  document.getElementById('challengeStatus').textContent = challenge.puzzleDate;
  scores.hidden = false;
  document.getElementById('challengerName').textContent = challenge.nickname;
  document.getElementById('challengerScore').textContent = challengeScoreText(challenge);
  const eventFields = { puzzle_date: challenge.puzzleDate, rules_version: challenge.rulesVersion, already_completed: dailyChallenge.openedCompleted === true };
  challengeEventOnce('challenge_opened', challenge.id, eventFields);
  if (dailyChallenge.started && !dailyChallenge.openedCompleted) challengeEventOnce('challenge_recipient_started', challenge.id, eventFields);
  const recipient = completedDailyScore();
  if (!recipient) return;
  const winner = compareChallengeScores(challenge, recipient);
  recipientColumn.hidden = false;
  document.getElementById('recipientName').textContent = getMessage('you');
  document.getElementById('recipientScore').textContent = challengeScoreText(recipient);
  comparison.hidden = false;
  comparison.textContent = getMessage(winner === 'recipient' ? 'youWon' : winner === 'challenger' ? 'friendWon' : 'draw');
  document.getElementById('challengeCompareBtn').hidden = false;
  document.getElementById('challengeCompareBtn').textContent = getMessage('shareComparison');
  if (dailyChallenge.started && !dailyChallenge.openedCompleted) challengeEventOnce('challenge_recipient_completed', challenge.id, { ...eventFields, result: recipient.result, guess_count: recipient.guessCount, hint_used: recipient.hintUsed });
}
function markChallengeRecipientStarted() {
  if (!dailyChallenge || dailyChallenge.openedCompleted || challengeStatusKey && challengeStatusKey !== 'challengeLoading') return;
  dailyChallenge.started = true; persistChallengeContext();
  renderDailyChallenge();
}
async function loadDailyChallenge() {
  if (!dailyChallenge) return;
  const id = dailyChallenge.id, version = ++challengeLoadVersion;
  challengeStatusKey = 'challengeLoading'; renderDailyChallenge();
  try {
    const data = await requestDailyChallenge(`/${id}`);
    if (version !== challengeLoadVersion || dailyChallenge?.id !== id) return;
    if (data.challenge.id !== id) throw new Error('challengeInvalid');
    dailyChallenge.metadata = data.challenge;
    challengeStatusKey = null;
  } catch (error) {
    if (version !== challengeLoadVersion || dailyChallenge?.id !== id) return;
    challengeStatusKey = ['challengeExpired', 'challengeFuture', 'challengeIncompatible', 'challengeInvalid'].includes(error.message) ? error.message : 'challengeUnavailable';
  }
  renderDailyChallenge();
}
function initializeDailyChallenge() {
  const url = new URL(location.href), stored = readChallengeStorage(CHALLENGE_CONTEXT_KEY);
  const raw = url.searchParams.has('challenge') ? url.searchParams.get('challenge') : stored?.id;
  if (!raw) { if (url.searchParams.has('challenge')) { localStorage.removeItem(CHALLENGE_CONTEXT_KEY); challengeStatusKey = 'challengeInvalid'; } renderDailyChallenge(); return; }
  const id = parseChallengeId(raw);
  if (!id) { dailyChallenge = null; localStorage.removeItem(CHALLENGE_CONTEXT_KEY); challengeStatusKey = 'challengeInvalid'; renderDailyChallenge(); return; }
  dailyChallenge = { id, openedCompleted: stored?.id === id ? stored.openedCompleted === true : !!completedDailyScore(), started: stored?.id === id && stored.started === true };
  persistChallengeContext(); loadDailyChallenge();
}
async function shareChallengeText(text) {
  if (navigator.share) {
    try { await navigator.share({ title: 'Narro', text }); return true; }
    catch (error) { if (error.name === 'AbortError') return false; }
  }
  await navigator.clipboard.writeText(text); return true;
}
document.getElementById('challengeFriendBtn').onclick = () => {
  challengeComposerOpen = !challengeComposerOpen;
  challengeMessageKey = null; renderChallengeComposer();
  if (challengeComposerOpen) document.getElementById('challengeNickname').focus();
};
document.getElementById('challengeCancelBtn').onclick = () => { challengeComposerOpen = false; challengeMessageKey = null; renderChallengeComposer(); document.getElementById('challengeFriendBtn').focus(); };
document.getElementById('challengeNickname').oninput = () => { outgoingChallenge = null; outgoingChallengeText = ''; challengeMessageKey = null; challengeMessageError = false; renderChallengeComposer(); };
document.getElementById('challengeComposer').onsubmit = async event => {
  event.preventDefault();
  if (challengeBusy || currentMode !== MODES.DAILY || !gameOver) return;
  const context = roundContextVersion;
  let metadata;
  try {
    const score = completedDailyScore(); if (!score) throw new Error('unavailable');
    metadata = normalizeChallengeMetadata({ ...score, nickname: document.getElementById('challengeNickname').value }, { today: challengePuzzleDate() });
  } catch (error) { challengeMessageKey = error.message === 'invalid_nickname' ? 'nicknameError' : 'challengeUnavailable'; challengeMessageError = true; renderChallengeComposer(); return; }
  challengeBusy = true; challengeMessageKey = null; challengeMessageError = false; renderChallengeComposer();
  try {
    const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(JSON.stringify(metadata)));
    const cacheKey = `narroChallengeCreated-${metadata.puzzleDate}-${Array.from(new Uint8Array(digest), b => b.toString(16).padStart(2, '0')).join('')}`;
    let cached = readChallengeStorage(cacheKey);
    if (!parseChallengeId(cached?.requestKey)) cached = { requestKey: crypto.randomUUID() };
    writeChallengeStorage(cacheKey, cached); // Persist the nonce before networking, so retrying a lost response is idempotent.
    let challenge;
    if (cached.challenge) {
      challenge = normalizePublicChallenge(cached.challenge);
      const { id, ...savedMetadata } = challenge;
      if (JSON.stringify(savedMetadata) !== JSON.stringify(metadata)) throw new Error('challengeInvalid');
    } else {
      const result = await requestDailyChallenge('', { ...metadata, idempotencyKey: cached.requestKey });
      challenge = result.challenge;
      const { id, ...savedMetadata } = challenge;
      if (JSON.stringify(savedMetadata) !== JSON.stringify(metadata)) throw new Error('challengeInvalid');
      writeChallengeStorage(cacheKey, { ...cached, challenge });
    }
    challengeEventOnce('challenge_created', challenge.id, { puzzle_date: challenge.puzzleDate, rules_version: challenge.rulesVersion, result: challenge.result, guess_count: challenge.guessCount, hint_used: challenge.hintUsed });
    if (context !== roundContextVersion || !challengeComposerOpen) return;
    outgoingChallenge = challenge;
    const link = challengeURL(challenge.id);
    document.getElementById('challengeLink').value = link;
    outgoingChallengeText = `${getMessage('challengeFriend')}\n${challenge.nickname} · Narro · ${challenge.puzzleDate}\n${challengeScoreText(challenge)}\n\n${link}`;
    challengeMessageKey = 'challengeReady'; renderChallengeComposer();
    try { if (await shareChallengeText(outgoingChallengeText) && context === roundContextVersion) challengeMessageKey = 'challengeCopied'; }
    catch { if (context === roundContextVersion) challengeMessageKey = 'challengeReady'; }
  } catch (error) {
    if (context === roundContextVersion) { challengeMessageKey = ['nicknameError', 'challengeExpired', 'challengeFuture', 'challengeIncompatible', 'challengeInvalid'].includes(error.message) ? error.message : 'challengeUnavailable'; challengeMessageError = true; }
  } finally { challengeBusy = false; renderChallengeComposer(); }
};
document.getElementById('challengeCopyBtn').onclick = async () => {
  const context = roundContextVersion, text = outgoingChallengeText;
  try { await navigator.clipboard.writeText(text); if (context === roundContextVersion) challengeMessageKey = 'challengeCopied'; }
  catch { if (context === roundContextVersion) { challengeMessageKey = 'challengeReady'; document.getElementById('challengeLink').focus(); document.getElementById('challengeLink').select(); } }
  renderChallengeComposer();
};
document.getElementById('challengeRetryBtn').onclick = loadDailyChallenge;
document.getElementById('challengeTodayBtn').onclick = () => {
  challengeLoadVersion++; dailyChallenge = null; challengeStatusKey = null;
  localStorage.removeItem(CHALLENGE_CONTEXT_KEY);
  const url = new URL(location.href); url.searchParams.delete('challenge');
  if (challengePuzzleDate() !== todayKey) { location.replace(url.href); return; }
  try { history.replaceState(null, '', url.href); } catch {}
  renderDailyChallenge(); focusActiveControl();
};
document.getElementById('challengeCompareBtn').onclick = async () => {
  const challenge = dailyChallenge?.metadata, recipient = completedDailyScore();
  if (!challenge || !recipient || challengeStatusKey || classifyChallenge(challenge, challengePuzzleDate()) !== 'current') return;
  const winner = compareChallengeScores(challenge, recipient);
  const text = `Narro · ${challenge.puzzleDate}\n${challenge.nickname}: ${challengeScoreText(challenge)}\n${getMessage('you')}: ${challengeScoreText(recipient)}\n${getMessage(winner === 'recipient' ? 'youWon' : winner === 'challenger' ? 'friendWon' : 'draw')}\n\n${challengeURL(challenge.id)}`;
  try {
    if (await shareChallengeText(text)) challengeEventOnce('challenge_comparison_shared', challenge.id, { puzzle_date: challenge.puzzleDate, rules_version: challenge.rulesVersion, already_completed: dailyChallenge?.openedCompleted === true });
  } catch { document.getElementById('challengeStatus').textContent = getMessage('shareCopyFailed'); }
};

/* ---------- COUNTDOWN ---------- */
updateCountdownText();
setInterval(updateCountdownText, 1000);

syncInputRange();
updateBar();

if (!gameOver && !parsedSavedState) {
  updateGuessUI();
}

// Final safety: if the game is active, input must remain enabled.
if (!gameOver && !demoMode) {
  input.disabled = false;
  btn.disabled = false;
}

if (demoMode) {
  runFirstTimeDemo();
}

if (!new URL(location.href).searchParams.has("challenge")) restoreFreePlayResult(localStorage.getItem("narroLastMode"));
refreshRoundUI();
initializeDailyChallenge();

document.getElementById("feedbackBtn")?.addEventListener("click", (e) => {
  e.preventDefault();
  e.stopPropagation();
  window.open(buildFeedbackURL(), "_blank", "noopener");
});

</script>

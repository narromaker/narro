<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-FW2QE6BL6R"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-FW2QE6BL6R');

  // Compute daily key locally (no dependency on later script)
  const todayKeyGA = new Date().toLocaleDateString("en-CA", {
    timeZone: "America/New_York"
  });
  const dailyStateKeyGA = `narroState-${todayKeyGA}`;

  if (!localStorage.getItem(dailyStateKeyGA)) {
    gtag("event", "game_start", {
      game_version: "v1.0"
    });
  }
</script>

<script>
  (function () {
    try {
      const savedTheme = localStorage.getItem("narroTheme");
      const prefersLight =
        window.matchMedia &&
        window.matchMedia("(prefers-color-scheme: light)").matches;
      const initialTheme =
        savedTheme === "light" || savedTheme === "dark"
          ? savedTheme
          : (prefersLight ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", initialTheme);
    } catch (_) {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  })();
</script>

<style>
  :root {
    --bg: #0f1220;
    --card: #161a33;
    --text: #ffffff;
    --muted: #9aa0c3;
    --accent: #6cf2c2;
    --danger: #ff6b6b;
    --hinted: #7db7ff;
    --win: hsl(45,100%,50%);
    --win-glow: hsla(45,100%,60%,0.6);
    --keyboard-inset: 0px;
    color-scheme: dark;
  }

  :root[data-theme="light"] {
    --bg: #eef2f7;
    --card: #ffffff;
    --text: #172439;
    --muted: #5f6f85;
    --accent: #62dcb1;
    --danger: #cc4949;
    --hinted: #6786ef;
    --win: hsl(45,100%,48%);
    --win-glow: hsla(45,100%,52%,0.48);
    color-scheme: light;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: system-ui, -apple-system, BlinkMacSystemFont;
    color: var(--text);
    transition: background 0.24s ease, color 0.24s ease;
    -webkit-tap-highlight-color: transparent;
  }

  :root[data-theme="light"] body {
    background:
      radial-gradient(1200px 700px at -120px -160px, rgba(103, 134, 239, 0.08), transparent 68%),
      radial-gradient(1100px 650px at 120% -150px, rgba(98, 220, 177, 0.09), transparent 66%),
      var(--bg);
  }

  body.keyboard-open {
    align-items: flex-start;
  }

  body.onboarding-active {
    align-items: flex-start;
  }

  .app {
    width: 100%;
    max-width: 420px;
    padding: 20px;
    text-align: center;
  }

  body.onboarding-active .app {
    padding-top: calc(12px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  }

  .game-shell {
    position: relative;
    transition:
      filter 0.24s ease,
      opacity 0.24s ease,
      transform 0.24s ease;
  }

  body.onboarding-active .game-shell {
    filter: grayscale(0.82) saturate(0.42) brightness(0.72);
    opacity: 0.52;
    transform: scale(0.988);
    pointer-events: none;
    user-select: none;
  }

  body.onboarding-active .game-shell::after {
    content: "";
    position: absolute;
    inset: -6px;
    border-radius: 24px;
    background: rgba(8, 12, 24, 0.22);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
    pointer-events: none;
  }

  body.onboarding-active .top-actions,
  body.onboarding-active #streak {
    opacity: 0.35;
    pointer-events: none;
    filter: grayscale(0.8);
  }

  body.onboarding-active #freePlayPanel {
    opacity: 0.18;
    pointer-events: none;
    filter: grayscale(1);
  }

  :root[data-theme="light"] body.onboarding-active .game-shell::after {
    background: rgba(238, 242, 247, 0.35);
    box-shadow: inset 0 0 0 1px rgba(23,36,57,0.06);
  }

  body.keyboard-open .app {
    padding-top: 10px;
    padding-bottom: calc(24px + var(--keyboard-inset));
  }

  h1 { margin: 0; font-size: 2rem; }

  .top-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #streak {
    margin-left: auto;
    margin-right: 2px;
    letter-spacing: 0.01em;
  }

  .top-actions {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .lang-menu-wrap {
    position: relative;
  }

  .lang-menu-btn {
    width: auto;
    min-width: 58px;
    height: 32px;
    margin-top: 0;
    padding: 0 10px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.06);
    color: var(--muted);
    font: inherit;
    font-size: 0.76rem;
    font-weight: 600;
    line-height: 1;
    box-shadow: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .lang-menu-btn:hover:not(:disabled) {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.24);
    transform: none;
    filter: none;
    box-shadow: none;
  }

  .lang-menu-code {
    letter-spacing: 0.06em;
  }

  .lang-menu {
    position: absolute;
    top: calc(100% + 10px);
    right: 0;
    width: min(190px, calc(100vw - 32px));
    padding: 12px;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.1);
    background:
      linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0)),
      var(--card);
    box-shadow:
      0 16px 34px rgba(0,0,0,0.28),
      inset 0 1px 0 rgba(255,255,255,0.05);
    z-index: 3200;
  }

  .lang-menu-label {
    display: block;
    margin-bottom: 8px;
    color: var(--muted);
    font-size: 0.8rem;
    font-weight: 600;
    text-align: left;
  }

  .lang-select {
    width: 100%;
    height: 40px;
    margin-top: 0;
    padding: 0 36px 0 12px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.06);
    color: var(--muted);
    font: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    line-height: 1;
    box-shadow: none;
    appearance: none;
    cursor: pointer;
  }

  .lang-select:hover {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.24);
  }

  :root[data-theme="light"] .lang-menu-btn,
  :root[data-theme="light"] .lang-select {
    background: rgba(23,36,57,0.06);
    border-color: rgba(23,36,57,0.16);
  }

  :root[data-theme="light"] .lang-menu-btn:hover:not(:disabled),
  :root[data-theme="light"] .lang-select:hover {
    background: rgba(23,36,57,0.1);
    border-color: rgba(23,36,57,0.24);
  }

  :root[data-theme="light"] .lang-menu {
    border-color: rgba(23,36,57,0.12);
    background:
      linear-gradient(180deg, rgba(255,255,255,0.94), rgba(255,255,255,0.88)),
      var(--card);
    box-shadow:
      0 16px 30px rgba(17,33,57,0.14),
      inset 0 1px 0 rgba(255,255,255,0.78);
  }

  .stats-btn {
    width: 32px;
    height: 32px;
    display: grid;
    place-items: center;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.06);
    color: var(--muted);
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
    transition: transform 0.16s ease, background 0.2s ease, border-color 0.2s ease;
  }

  .stats-btn:hover {
    transform: translateY(-1px);
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.24);
  }

  :root[data-theme="light"] .stats-btn {
    background: rgba(23,36,57,0.06);
    border-color: rgba(23,36,57,0.16);
  }

  :root[data-theme="light"] .stats-btn:hover {
    background: rgba(23,36,57,0.1);
    border-color: rgba(23,36,57,0.24);
  }

  .card {
  background: linear-gradient(
    180deg,
    rgba(255,255,255,0.03),
    rgba(255,255,255,0)
  ), var(--card);
  border-radius: 18px;
  padding: 22px;
  margin-top: 16px;
  border: 1px solid rgba(255,255,255,0.06);
  box-shadow:
    0 8px 24px rgba(0,0,0,0.35),
    inset 0 1px 0 rgba(255,255,255,0.04);
}

  :root[data-theme="light"] .card {
  background: linear-gradient(
    180deg,
    rgba(255,255,255,0.94),
    rgba(255,255,255,0.86)
  ), var(--card);
  border-color: rgba(23,36,57,0.12);
  box-shadow:
    0 8px 22px rgba(17,33,57,0.12),
    inset 0 1px 0 rgba(255,255,255,0.8);
}

  .onboarding-callout {
    position: relative;
    margin-top: 16px;
    padding: 16px 16px 14px;
    border-radius: 18px;
    text-align: left;
    background:
      linear-gradient(145deg, rgba(108,242,194,0.18), rgba(108,242,194,0.06)),
      rgba(19, 24, 46, 0.92);
    border: 1px solid rgba(108,242,194,0.34);
    box-shadow:
      0 18px 40px rgba(0,0,0,0.28),
      0 0 0 1px rgba(108,242,194,0.08) inset;
    animation: onboardingLift 0.5s ease;
  }

  .onboarding-callout::after {
    content: "";
    position: absolute;
    left: 30px;
    bottom: -10px;
    width: 20px;
    height: 20px;
    background: inherit;
    border-right: 1px solid rgba(108,242,194,0.34);
    border-bottom: 1px solid rgba(108,242,194,0.34);
    transform: rotate(45deg);
  }

  :root[data-theme="light"] .onboarding-callout {
    background:
      linear-gradient(145deg, rgba(98,220,177,0.22), rgba(98,220,177,0.09)),
      rgba(255,255,255,0.98);
    border-color: rgba(31,164,127,0.32);
    box-shadow:
      0 16px 34px rgba(17,33,57,0.14),
      0 0 0 1px rgba(98,220,177,0.14) inset;
  }

  :root[data-theme="light"] .onboarding-callout::after {
    border-right-color: rgba(31,164,127,0.32);
    border-bottom-color: rgba(31,164,127,0.32);
  }

  .onboarding-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(108,242,194,0.18);
    color: var(--accent);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  :root[data-theme="light"] .onboarding-eyebrow {
    background: rgba(98,220,177,0.18);
    color: #13785e;
  }

  .onboarding-title {
    margin: 12px 0 6px;
    font-size: 1.1rem;
    font-weight: 700;
    line-height: 1.2;
  }

  .onboarding-copy {
    margin: 0;
    color: var(--muted);
    font-size: 0.92rem;
    line-height: 1.45;
  }

  .onboarding-actions {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }

  .onboarding-demo-btn,
  .onboarding-play-btn {
    width: auto;
    margin-top: 0;
    justify-content: center;
    min-height: 48px;
  }

  .onboarding-demo-btn {
    flex: 1.3;
    font-weight: 700;
    box-shadow:
      0 10px 22px rgba(108,242,194,0.26),
      0 0 0 1px rgba(255,255,255,0.08) inset;
    animation: onboardingPulse 1.7s ease-in-out infinite;
  }

  .onboarding-play-btn {
    flex: 1;
    background: rgba(255,255,255,0.06);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow: none;
  }

  .onboarding-play-btn:hover:not(:disabled) {
    box-shadow: none;
  }

  :root[data-theme="light"] .onboarding-play-btn {
    background: rgba(23,36,57,0.05);
    border-color: rgba(23,36,57,0.14);
    color: var(--text);
  }

  @keyframes onboardingLift {
    0% {
      opacity: 0;
      transform: translateY(8px);
    }
    100% {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes onboardingPulse {
    0%, 100% {
      transform: translateY(0);
      box-shadow:
        0 10px 22px rgba(108,242,194,0.26),
        0 0 0 1px rgba(255,255,255,0.08) inset;
    }
    50% {
      transform: translateY(-1px);
      box-shadow:
        0 14px 28px rgba(108,242,194,0.34),
        0 0 0 1px rgba(255,255,255,0.12) inset;
    }
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  input[type="number"] {
    width: 100%;
    font-size: 1.4rem;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.05);
    color: var(--text);
    text-align: center;
    transition: border-color 0.18s ease, background 0.18s ease;
  }

  :root[data-theme="light"] input[type="number"] {
    border-color: rgba(23,36,57,0.18);
    background: rgba(17,33,57,0.04);
  }

  button {
    width: 100%;
    margin-top: 12px;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-size: 1rem;
    background: var(--accent);
    color: #000;
    cursor: pointer;
    box-shadow: 0 8px 16px rgba(108,242,194,0.24);
    transition: transform 0.15s ease, filter 0.2s ease, box-shadow 0.2s ease;
  }

  button:hover:not(:disabled) {
    transform: translateY(-1px);
    filter: brightness(1.03);
    box-shadow: 0 10px 20px rgba(108,242,194,0.28);
  }

  button:active:not(:disabled) {
    transform: translateY(0);
    filter: brightness(0.98);
  }

  @keyframes demoGuessPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.02); }
  }

  #guessBtn.demo-pulse {
    animation: demoGuessPulse 0.9s ease-in-out infinite;
  }

  #guessInput.demo-highlight {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(108,242,194,0.25);
  }

  .theme-btn {
    width: 32px;
    height: 32px;
    margin-top: 0;
    padding: 0;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.06);
    color: var(--muted);
    display: grid;
    place-items: center;
    font-size: 0.95rem;
    font-weight: 700;
    line-height: 1;
    box-shadow: none;
  }

  .theme-btn:hover:not(:disabled) {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.24);
    filter: none;
    box-shadow: none;
  }

  :root[data-theme="light"] .theme-btn {
    background: rgba(23,36,57,0.06);
    border-color: rgba(23,36,57,0.16);
  }

  :root[data-theme="light"] .theme-btn:hover:not(:disabled) {
    background: rgba(23,36,57,0.1);
    border-color: rgba(23,36,57,0.24);
  }

  button:disabled { opacity: 0.5; cursor: default; }

  .demo-controls {
    display: none;
    margin-top: 12px;
    align-items: center;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .demo-next-btn,
  .demo-skip-btn {
    width: auto;
    margin: 0;
    border-radius: 9px;
    border: 1px solid rgba(255,255,255,0.28);
    box-shadow: none;
    transform: none;
    filter: none;
  }

  .demo-next-btn {
    padding: 8px 12px;
    background: rgba(108,242,194,0.16);
    color: var(--text);
    font-size: 0.8rem;
    font-weight: 600;
  }

  .demo-skip-btn {
    padding: 8px 10px;
    background: rgba(255,255,255,0.04);
    color: var(--muted);
    font-size: 0.74rem;
    line-height: 1;
    opacity: 0.95;
  }

  .demo-next-btn:hover:not(:disabled),
  .demo-skip-btn:hover:not(:disabled) {
    transform: none;
    filter: none;
    box-shadow: none;
    opacity: 1;
    background: rgba(255,255,255,0.12);
  }

  :root[data-theme="light"] .demo-next-btn,
  :root[data-theme="light"] .demo-skip-btn {
    border-color: rgba(23,36,57,0.2);
  }

  :root[data-theme="light"] .demo-next-btn {
    background: rgba(98,220,177,0.22);
  }

  :root[data-theme="light"] .demo-skip-btn {
    background: rgba(23,36,57,0.05);
  }

  :root[data-theme="light"] .demo-next-btn:hover:not(:disabled),
  :root[data-theme="light"] .demo-skip-btn:hover:not(:disabled) {
    background: rgba(23,36,57,0.1);
  }

  @media (max-width: 480px) {
    .app {
      max-width: 100%;
      padding: 14px;
    }

    body.onboarding-active .app {
      padding-top: calc(10px + env(safe-area-inset-top, 0px));
      padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    }

    .card {
      margin-top: 12px;
      padding: 18px 16px;
      border-radius: 16px;
    }

    .onboarding-callout {
      margin-top: 12px;
      padding: 14px 14px 12px;
      border-radius: 16px;
    }

    .onboarding-callout::after {
      display: none;
    }

    .onboarding-title {
      margin-top: 10px;
      font-size: 1rem;
    }

    .onboarding-copy {
      font-size: 0.88rem;
      line-height: 1.35;
    }

    .onboarding-actions {
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }

    .onboarding-demo-btn,
    .onboarding-play-btn {
      width: 100%;
    }

    .demo-controls {
      flex-direction: column;
      align-items: stretch;
    }

    .demo-next-btn,
    .demo-skip-btn {
      width: 100%;
      justify-content: center;
    }
  }

  @media (max-width: 480px) and (max-height: 760px) {
    .onboarding-copy {
      font-size: 0.83rem;
      line-height: 1.3;
    }

    .onboarding-title {
      font-size: 0.96rem;
    }
  }

  input[type="number"]:focus-visible,
  button:focus-visible,
  .stats-btn:focus-visible,
  .theme-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .feedback {
    margin-top: 14px;
    font-size: 1.15rem;
    font-weight: 500;
    min-height: 1.4em;
    transition: opacity 0.2s ease, transform 0.22s ease;
    transform-origin: center;
  }

  .feedback.critical {
  letter-spacing: 0.08em;
  animation: breathHold 1.4s ease-in-out infinite;
}

@keyframes breathHold {
  0%   { opacity: 1; }
  50%  { opacity: 0.75; }
  100% { opacity: 1; }
}

@keyframes orbHintShine {
  0%, 100% {
    background: radial-gradient(circle at 30% 30%, rgba(108,242,194,0.95), rgba(72,210,160,1));
    box-shadow: 0 0 10px rgba(108,242,194,0.45), inset 0 1px 2px rgba(255,255,255,0.4);
  }
  50% {
    background: radial-gradient(circle at 40% 40%, rgba(150,255,210,0.95), rgba(100,230,180,1));
    box-shadow: 0 0 14px rgba(150,255,210,0.45), inset 0 1px 2px rgba(255,255,255,0.5);
  }
}

  @keyframes orbWinPulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1); filter: brightness(1); }
  50% { transform: translate(-50%, -50%) scale(1.08); filter: brightness(1.15); }
}

.bar-orb.win-pulse {
  animation: orbWinPulse 1.2s ease-in-out infinite;
}

.closest-one {
  color: var(--accent);
  font-weight: 600;
  animation: oneAwayPulse 1.2s ease-in-out infinite;
}

@keyframes oneAwayPulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.7; }
}

  .toast {
  margin-top: 8px;
  font-size: 0.85rem;
  color: var(--danger);
  opacity: 0;
  transition: opacity 0.24s ease;
}

.draggable-cue {
  transition: box-shadow 0.3s ease;
  box-shadow: 0 0 0px rgba(255, 255, 0, 0);
}

.draggable-cue:hover {
  box-shadow: 0 0 10px 2px rgba(255, 255, 0, 0.8);

  <script>
    const freePlayPanel = document.getElementById("freePlayPanel");
const freePlayMainBtn = document.getElementById("freePlayMainBtn");
const freePlayModes = document.getElementById("freePlayModes");
const freePlayModeBtns = document.querySelectorAll(".freePlayModeBtn");

// Initially locked
let freePlayUnlocked = false;
freePlayPanel.style.display = "block"; // always visible
freePlayMainBtn.disabled = true;
freePlayMainBtn.setAttribute("aria-controls", "freePlayModes");
freePlayMainBtn.setAttribute("aria-expanded", "false");

function setFreePlayModesOpen(isOpen) {
  freePlayModes.style.display = isOpen ? "flex" : "none";
  freePlayMainBtn.setAttribute("aria-expanded", isOpen ? "true" : "false");
}

// --- RESTORE UNLOCKED STATE ON LOAD ---
if (localStorage.getItem("narroFreePlayUnlocked") === "true") {
  unlockFreePlay();
}

// Unlock after daily game ends
function unlockFreePlay() {
  if (freePlayUnlocked) return;

  freePlayUnlocked = true;
  localStorage.setItem("narroFreePlayUnlocked", "true");

  freePlayMainBtn.disabled = false;
  freePlayMainBtn.style.opacity = "1";
  freePlayMainBtn.style.pointerEvents = "auto";
}

// Toggle mode buttons
freePlayMainBtn.addEventListener("click", () => {
  if (!freePlayUnlocked) return; // safety
  setFreePlayModesOpen(freePlayModes.style.display !== "flex");
});

// Start free play when a mode button is clicked
freePlayModeBtns.forEach(btn => {
  btn.addEventListener("click", () => {
    const mode = btn.dataset.mode;
    startFreePlay(mode);
    setFreePlayModesOpen(false);
  });
});

document.addEventListener("click", (e) => {
  if (!freePlayPanel.contains(e.target)) {
    setFreePlayModesOpen(false);
  }
});

function getEasternDateParts() {
  const now = new Date();
  const formatter = new Intl.DateTimeFormat("en-US", {
    timeZone: "America/New_York",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  });
  const parts = formatter.formatToParts(now);
  const get = t => parts.find(p => p.type === t).value;
  return { year: get("year"), month: get("month"), day: get("day") };
}

function seededNumber(seed) {
  // Hash the seed string into a 32-bit integer
  let h = 2166136261;
  for (let i = 0; i < seed.length; i++) {
    h ^= seed.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }

  // Mulberry32 PRNG (deterministic, decorrelated)
  function mulberry32(a) {
    return function () {
      let t = (a += 0x6D2B79F5);
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const rand = mulberry32(h)();
  return Math.floor(rand * MAX_RANGE) + 1;
}

function normalizeLanguageCode(rawValue) {
  return String(rawValue || "")
    .trim()
    .toLowerCase()
    .replace(/_/g, "-");
}

function resolveSupportedLanguage(rawValue) {
  const normalized = normalizeLanguageCode(rawValue);
  if (!normalized) return null;
  if (LANGUAGE_META[normalized]) return normalized;
  if (LANGUAGE_ALIASES[normalized]) return LANGUAGE_ALIASES[normalized];

  const parts = normalized.split("-");
  if (parts.length > 1) {
    const composite = `${parts[0]}-${parts[1]}`;
    if (LANGUAGE_META[composite]) return composite;
    if (LANGUAGE_ALIASES[composite]) return LANGUAGE_ALIASES[composite];
  }

  const base = parts[0];
  return LANGUAGE_META[base] ? base : null;
}

function detectPreferredLanguage() {
  const browserLanguages = Array.isArray(navigator.languages) && navigator.languages.length
    ? navigator.languages
    : [navigator.language, navigator.userLanguage].filter(Boolean);

  for (const browserLanguage of browserLanguages) {
    const supportedLanguage = resolveSupportedLanguage(browserLanguage);
    if (supportedLanguage) return supportedLanguage;
  }

  return DEFAULT_LANGUAGE;
}

let currentLanguage = resolveSupportedLanguage(localStorage.getItem(LANGUAGE_STORAGE_KEY)) ||
  detectPreferredLanguage();

function getMessage(key, vars = {}, language = currentLanguage) {
  const pack = MESSAGES[language] || MESSAGES[DEFAULT_LANGUAGE];
  const fallbackPack = MESSAGES[DEFAULT_LANGUAGE];
  const template = pack[key] ?? fallbackPack[key] ?? "";
  return typeof template === "function" ? template(vars) : template;
}

function formatNumber(value, language = currentLanguage) {
  const locale = LANGUAGE_META[language]?.locale || LANGUAGE_META[DEFAULT_LANGUAGE].locale;
  return new Intl.NumberFormat(locale).format(value);
}

function formatCountdownUnit(value) {
  return String(value).padStart(2, "0");
}

      return String(language || DEFAULT_LANGUAGE).split("-")[0].toUpperCase();
  }
}

function closeLanguageMenu(options = {}) {
  if (!languageMenu || !languageMenuBtn) return;
  const restoreFocus = options.restoreFocus === true;
  languageMenu.hidden = true;
  languageMenuBtn.setAttribute("aria-expanded", "false");
  if (restoreFocus) {
    languageMenuBtn.focus();
  }
}

function openLanguageMenu() {
  if (!languageMenu || !languageMenuBtn) return;
  languageMenu.hidden = false;
  languageMenuBtn.setAttribute("aria-expanded", "true");
}

function toggleLanguageMenu() {
  if (!languageMenu || !languageMenuBtn) return;
  if (languageMenu.hidden) {
    openLanguageMenu();
  } else {
    closeLanguageMenu();
  }
}

function updateLanguageSelector() {
  if (languageLabel) languageLabel.textContent = getMessage("languageLabel");
  if (!languageSelect) return;
  const optionMarkup = Object.entries(LANGUAGE_META)
    .map(([code, meta]) => `<option value="${code}">${meta.label}</option>`)
    .join("");
  if (languageSelect.innerHTML !== optionMarkup) {
    languageSelect.innerHTML = optionMarkup;
  }
  languageSelect.value = currentLanguage;
  languageSelect.setAttribute("aria-label", getMessage("languageLabel"));
  if (languageMenuCode) {
    languageMenuCode.textContent = getLanguageMenuCode(currentLanguage);
  }
  if (languageMenuBtn) {
    const title = `${getMessage("languageLabel")}: ${LANGUAGE_META[currentLanguage]?.label || currentLanguage}`;
    languageMenuBtn.setAttribute("aria-label", title);
    languageMenuBtn.setAttribute("title", title);
  }
}

function updateCountdownText() {
  const now = new Date();
  const easternNow = new Date(now.toLocaleString("en-US", { timeZone: "America/New_York" }));
  const nextMidnight = new Date(easternNow);
  nextMidnight.setHours(24, 0, 0, 0);
  const diff = nextMidnight - easternNow;
  const h = Math.floor(diff / 36e5);
  const m = Math.floor((diff % 36e5) / 6e4);
  const s = Math.floor((diff % 6e4) / 1000);
  const timeText =
    `${formatCountdownUnit(h)}<span class="colon-blink">:</span>` +

  themeToggleBtn.setAttribute("aria-pressed", isDark ? "false" : "true");

    "title",
    getMessage("switchThemeTo", {

    })
  );
}

function applyTheme(theme, options = {}) {
  const persist = options.persist !== false;
  const normalizedTheme = theme === THEME_LIGHT ? THEME_LIGHT : THEME_DARK;
  document.documentElement.setAttribute("data-theme", normalizedTheme);
  updateThemeToggle(normalizedTheme);
  if (!persist) return;
  try {
    localStorage.setItem(THEME_STORAGE_KEY, normalizedTheme);
  } catch (_) {
    // noop: unavailable storage should not block theme switching
  }
}

function handleDemoGuess(g) {
  if (!demoRunning || !demoTutorialState) return false;

  const state = demoTutorialState;
  const expectedGuess = DEMO_PRACTICE_GUESSES[state.step];

  if (!Number.isFinite(expectedGuess)) return false;

  if (g !== expectedGuess) {
    showToast(getMessage("demoWrongGuess", { value: formatNumber(expectedGuess) }), 1800);
    setDemoPracticePrompt(state.step);
    focusGuessInputForDemo();
    return true;
  }

  input.value = "";

  if (state.step === 0) {
    state.step = 1;
    max = expectedGuess - 1;
    updateBar();
    syncInputRange();

    setGuessCountMessage("practiceGuess", { current: 2, total: 2 });
    setFeedbackMessage("demoGuessHigh", { value: formatNumber(expectedGuess) });
    setTipMessage("demoGuessFromBelow", { value: formatNumber(DEMO_SECOND_GUESS) });
    setDemoPracticePrompt(1);
    focusGuessInputForDemo();
    return true;
  }

  state.step = 2;
  min = expectedGuess + 1;
  updateBar();
  syncInputRange();

  setFeedbackMessage("demoGuessLow", { value: formatNumber(expectedGuess) });
  setTipMessage("demoSqueezeWholeGame");
  btn.classList.remove("demo-pulse");
  input.classList.remove("demo-highlight");
  input.disabled = true;
  btn.disabled = true;
  setGuessButtonLabel(getMessage("starting"));
  setDemoSkipVisible(false);

  window.setTimeout(() => {
    finishFirstTimeDemo(false, state.originalSecret);
  }, 900);

  return true;
}

    if (mode !== MODES.DAILY) return null;

    return parsed.result === "win" || parsed.result === "lose"
      ? parsed.result
      : null;
  } catch (err) {

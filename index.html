<title>Narro</title>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-FW2QE6BL6R"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  // Challenge IDs stay out of analytics page locations and referrers.
  const analyticsLocation = new URL(location.href);
  analyticsLocation.searchParams.delete('challenge');
  let analyticsReferrer = document.referrer;
  try { const ref = new URL(analyticsReferrer); ref.searchParams.delete('challenge'); analyticsReferrer = ref.href; } catch {}
  gtag('config', 'G-FW2QE6BL6R', { page_location: analyticsLocation.href, page_referrer: analyticsReferrer });

  // Compute daily key locally (no dependency on later script)
  const todayKeyGA = new Date().toLocaleDateString("en-CA", {
    timeZone: "America/New_York"
  });
  const dailyStateKeyGA = `narroState-${todayKeyGA}`;

  if (!localStorage.getItem(dailyStateKeyGA) && !localStorage.getItem(`narroStarted-${todayKeyGA}`)) {
    localStorage.setItem(`narroStarted-${todayKeyGA}`, "true");
    gtag("event", "game_start", {
      game_version: "v1.0"
    });
  }
</script>

<script>
  (function () {
    try {
      const savedTheme = localStorage.getItem("narroTheme");
      const prefersLight =
        window.matchMedia &&
        window.matchMedia("(prefers-color-scheme: light)").matches;
      const initialTheme =
        savedTheme === "light" || savedTheme === "dark"
          ? savedTheme
          : (prefersLight ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", initialTheme);
    } catch (_) {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  })();
</script>

<style>
  :root {
    --bg: #0f1220;
    --card: #161a33;
    --text: #ffffff;
    --muted: #9aa0c3;

    --danger: #ff6b6b;
    --hinted: #7db7ff;

    --win-glow: hsla(45,100%,60%,0.6);
    --keyboard-inset: 0px;
    color-scheme: dark;
  }

  :root[data-theme="light"] {
    --bg: #eef2f7;
    --card: #ffffff;
    --text: #172439;
    --muted: #5f6f85;
    --accent: #62dcb1;
    --danger: #cc4949;
    --hinted: #6786ef;

    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: system-ui, -apple-system, BlinkMacSystemFont;
    color: var(--text);

    -webkit-tap-highlight-color: transparent;
  }

  :root[data-theme="light"] body {
    background:
      radial-gradient(1200px 700px at -120px -160px, rgba(103, 134, 239, 0.08), transparent 68%),

      var(--bg);
  }

  body.keyboard-open {
    align-items: flex-start;
  }

  body.onboarding-active {
    align-items: flex-start;
  }

  .app {
    width: 100%;
    max-width: 420px;
    padding: 20px;
    text-align: center;
  }

  body.onboarding-active .app {
    padding-top: calc(12px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  }

  .game-shell {
    position: relative;
    transition:
      filter 0.24s ease,
      opacity 0.24s ease,
      transform 0.24s ease;

  body.onboarding-active .game-shell {

    transform: scale(0.988);

    user-select: none;

    inset: -6px;
    border-radius: 24px;
    background: rgba(8, 12, 24, 0.22);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
    pointer-events: none;
  }

  body.onboarding-active .top-actions,
  body.onboarding-active #streak {
    opacity: 0.35;
    pointer-events: none;
    filter: grayscale(0.8);
  }

  body.onboarding-active #freePlayPanel {
    opacity: 0.18;
    pointer-events: none;
    filter: grayscale(1);
  }

  :root[data-theme="light"] body.onboarding-active .game-shell::after {
    background: rgba(238, 242, 247, 0.35);
    box-shadow: inset 0 0 0 1px rgba(23,36,57,0.06);

  body.keyboard-open .app {

    padding-bottom: calc(24px + var(--keyboard-inset));

  .card {

  .onboarding-callout {

    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;

    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  }

  button:hover:not(:disabled) {

  }

  button:active:not(:disabled) {

  @keyframes demoGuessPulse {

  #guessBtn.demo-pulse {

  }

  #guessInput.demo-highlight {

  :root[data-theme="light"] .theme-btn {

  :root[data-theme="light"] .demo-next-btn,
  :root[data-theme="light"] .demo-skip-btn {

  }

  }

  :root[data-theme="light"] .demo-next-btn:hover:not(:disabled),
  :root[data-theme="light"] .demo-skip-btn:hover:not(:disabled) {

      max-width: 100%;
      padding: 14px;
    }

    body.onboarding-active .app {
      padding-top: calc(10px + env(safe-area-inset-top, 0px));
      padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    }

      margin-top: 12px;
      padding: 18px 16px;
      border-radius: 16px;
    }

    .onboarding-callout {
      margin-top: 12px;
      padding: 14px 14px 12px;

    }

      display: none;
    }

      margin-top: 10px;

      font-size: 0.88rem;
      line-height: 1.35;
    }

      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }

    .onboarding-demo-btn,
    .onboarding-play-btn {
      width: 100%;
    }

    .demo-controls {
      flex-direction: column;
      align-items: stretch;
    }

    .demo-next-btn,
    .demo-skip-btn {
      width: 100%;
      justify-content: center;
    }

  @media (max-width: 480px) and (max-height: 760px) {
    .onboarding-copy {
      font-size: 0.83rem;
      line-height: 1.3;
    }

    .onboarding-title {
      font-size: 0.96rem;
    }

  input[type="number"]:focus-visible,
  .challenge-composer input[type="text"]:focus-visible,
  button:focus-visible,
  .stats-btn:focus-visible,
  .theme-btn:focus-visible {

  }

  .feedback {
    margin-top: 14px;
    font-size: 1.15rem;
    font-weight: 500;
    min-height: 1.4em;
    transition: opacity 0.2s ease, transform 0.22s ease;
    transform-origin: center;

  letter-spacing: 0.08em;

}

@keyframes breathHold {
  0%   { opacity: 1; }
  50%  { opacity: 0.75; }

}

@keyframes orbHintShine {
  0%, 100% {
    background: radial-gradient(circle at 30% 30%, rgba(108,242,194,0.95), rgba(72,210,160,1));
    box-shadow: 0 0 10px rgba(108,242,194,0.45), inset 0 1px 2px rgba(255,255,255,0.4);

  50% {
    background: radial-gradient(circle at 40% 40%, rgba(150,255,210,0.95), rgba(100,230,180,1));
    box-shadow: 0 0 14px rgba(150,255,210,0.45), inset 0 1px 2px rgba(255,255,255,0.5);
  }
}

  @keyframes orbWinPulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1); filter: brightness(1); }
  50% { transform: translate(-50%, -50%) scale(1.08); filter: brightness(1.15); }
}

.bar-orb.win-pulse {
  animation: orbWinPulse 1.2s ease-in-out infinite;
}

.closest-one {

  .bar {
  position: relative;
  height: 18px;
  background: linear-gradient(
    to bottom,
    #2f3466,
    #24284d
  );
  border-radius: 999px;
  overflow: hidden;
  margin-top: 10px;
  cursor: pointer;

  /* Depth */
  box-shadow:
    inset 0 2px 4px rgba(255,255,255,0.06),
    inset 0 -2px 6px rgba(0,0,0,0.4),
    0 6px 18px rgba(0,0,0,0.35);

  transition:
    box-shadow 0.35s ease,
    transform 0.25s ease;
}

:root[data-theme="light"] .bar {
  background: linear-gradient(
    to bottom,
    #c4cfdf,
    #aab8ce
  );
  box-shadow:
    inset 0 2px 4px rgba(255,255,255,0.45),
    inset 0 -2px 6px rgba(37,52,78,0.28),
    0 6px 16px rgba(23,36,57,0.16);
}

/* Subtle “this is interactive” cue */
.bar:hover {
  transform: translateY(-1px);
}

  .bar-fill {
  position: absolute;
  height: 100%;
  background: linear-gradient(
    120deg,
    #6cf2c2,
    #4fe0b0
  );
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.35),
    0 0 12px rgba(108,242,194,0.35);

  transition:
    left 0.35s ease,
    width 0.35s ease,
    background 0.3s ease;
}

.bar:not(.win) .bar-fill {
  opacity: 0;
  box-shadow: none;
}

  .bar.hint-ready {
  box-shadow:
    inset 0 2px 4px rgba(255,255,255,0.08),
    0 0 22px rgba(108,242,194,0.65);
}

/* Hint collapse animation */
.bar-fill.hint-animating {
  transition:
    left 0.32s cubic-bezier(0.22, 1, 0.36, 1),
    width 0.32s cubic-bezier(0.22, 1, 0.36, 1),
    transform 0.18s ease,
    filter 0.18s ease;

  transform: scaleY(1.25);
  filter: brightness(1.35);
}

  .bar.hinted .bar-fill {
    background: var(--hinted);
    box-shadow: 0 0 10px rgba(125,183,255,0.6);
    animation: hintPulse 1.5s ease;
  }

  @keyframes hintPulse {
    0%,100% { box-shadow: 0 0 10px rgba(125,183,255,0.6); }
    50% { box-shadow: 0 0 18px rgba(125,183,255,0.8); }
  }
  
  .bar.win {
  background: linear-gradient(
    to bottom,
    hsla(45,100%,35%,0.6),
    hsla(45,100%,25%,0.6)
  );
}

  .bar-fill.win {
    background: var(--win);
    left: 0 !important;
    width: 100% !important;
    animation: winPulse 0.6s ease 1, winShine 0.5s ease 1 0.1s;
  }

  .bar.near .bar-fill {
    background: linear-gradient(120deg, #8ed0ff, #67b6f2);
    left: 0 !important;
    width: 100% !important;
    opacity: 1;
    box-shadow: 0 0 12px rgba(103,182,242,0.55);
    animation: nearPulse 0.42s ease 1;
  }

  @keyframes nearPulse {
    0% { filter: brightness(1); transform: scaleX(1); }
    50% { filter: brightness(1.15); transform: scaleX(1.03); }
    100% { filter: brightness(1); transform: scaleX(1); }
  }

  .bar.win .bar-handle {
  opacity: 0;
}

  .bar.no-brackets .bar-handle {
  opacity: 0;
  transform: scale(0.6);
  transition: opacity 0.25s ease, transform 0.25s ease;
  pointer-events: none;
}

  .bar-handle {
  position: absolute;
  top: 50%;
  width: 6px;
  height: 26px;

  background: rgba(255,255,255,0.6);
  border-radius: 3px;

  transform: translateY(-50%);
  pointer-events: none;

  box-shadow:
    0 0 6px rgba(108,242,194,0.45),
    inset 0 0 4px rgba(255,255,255,0.45);

  transition:
    left 0.35s ease,
    opacity 0.25s ease;
}

.bar-handle.left {
  left: calc(var(--fill-left) - 3px);
}

.bar-handle.right {
  left: calc(var(--fill-left) + var(--fill-width) - 3px);
}

  @keyframes winPulse {
    0% { transform: scaleX(1); filter: brightness(1); background-color: var(--win); }
    50% { transform: scaleX(1.08); filter: brightness(1.3); background-color: hsl(50,100%,60%); }
    100% { transform: scaleX(1); filter: brightness(1); background-color: var(--win); }
  }

  @keyframes winShine {
    0% { background: linear-gradient(120deg, hsl(45,100%,50%) 0%, hsl(45,100%,50%) 0%, hsl(50,100%,60%) 50%, hsl(45,100%,50%) 100%); background-size: 200% 100%; }
    100% { background-position: 200% 0; }
  }

  /* ---------- NARRO ORB ---------- */
.bar-orb {
  position: absolute;
  top: 50%;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  z-index: 6;
  pointer-events: none;
  touch-action: auto;
  cursor: default;

  background:
    radial-gradient(
      circle at 30% 30%,
      rgba(108,242,194,0.95),
      rgba(72,210,160,1)
    );

  transform: translate(-50%, -50%);
  transition:
    left 0.5s cubic-bezier(0.18, 0.88, 0.26, 1),
    filter 0.24s ease-out,
    box-shadow 0.24s ease-out;
  will-change: left, filter, box-shadow;

  box-shadow:
    0 0 10px rgba(108,242,194,0.45),
    inset 0 1px 2px rgba(255,255,255,0.4);
}

.bar-orb.orb-moving {
  filter: brightness(1.1) saturate(1.04);
  box-shadow:
    0 0 13px rgba(108,242,194,0.55),
    inset 0 1px 2px rgba(255,255,255,0.46);
}

:root[data-theme="light"] .bar-orb {
  background:
    radial-gradient(
      circle at 32% 30%,
      #b7ffe6 0%,
      #39d5ac 46%,
      #1fa47f 100%
    );
  border: 1px solid rgba(255,255,255,0.82);
  box-shadow:
    0 0 0 1px rgba(21,45,68,0.32),
    0 0 12px rgba(31,164,127,0.5),
    inset 0 1px 2px rgba(255,255,255,0.65);
}

:root[data-theme="light"] .bar-orb.orb-moving {
  filter: brightness(1.08) saturate(1.08);
  box-shadow:
    0 0 0 1px rgba(21,45,68,0.34),
    0 0 16px rgba(31,164,127,0.62),
    inset 0 1px 2px rgba(255,255,255,0.72);
}

.bar.inverted-mode {
  cursor: default;
}

.bar.inverted-mode::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(
      to right,
      transparent 49.85%,
      rgba(255,255,255,0.34) 49.85%,
      rgba(255,255,255,0.34) 50.15%,
      transparent 50.15%
    ),
    linear-gradient(

      transparent 24.9%,
      rgba(255,255,255,0.16) 24.9%,

    ),

      rgba(255,255,255,0.16) 75.1%,

    );
}

:root[data-theme="light"] .bar.inverted-mode::before {

      transparent 50.15%
    ),
    linear-gradient(

      transparent 24.9%,
      rgba(18,34,56,0.13) 24.9%,
      rgba(18,34,56,0.13) 25.1%,
      transparent 25.1%
    ),
    linear-gradient(

      transparent 74.9%,
      rgba(18,34,56,0.13) 74.9%,
      rgba(18,34,56,0.13) 75.1%,
      transparent 75.1%
    );
}

    const freePlayPanel = document.getElementById("freePlayPanel");

const freePlayModes = document.getElementById("freePlayModes");
const freePlayModeBtns = document.querySelectorAll(".freePlayModeBtn");

// Initially locked
let freePlayUnlocked = false;
freePlayPanel.style.display = "block"; // always visible
freePlayMainBtn.disabled = true;
freePlayMainBtn.setAttribute("aria-controls", "freePlayModes");
freePlayMainBtn.setAttribute("aria-expanded", "false");

function setFreePlayModesOpen(isOpen) {
  freePlayModes.style.display = isOpen ? "flex" : "none";
  freePlayMainBtn.setAttribute("aria-expanded", isOpen ? "true" : "false");
  document.getElementById("resultModesBtn").setAttribute("aria-expanded", isOpen ? "true" : "false");
}

// --- RESTORE UNLOCKED STATE ON LOAD ---
if (localStorage.getItem("narroFreePlayUnlocked") === "true") {
  unlockFreePlay();
}

// Unlock after daily game ends
function unlockFreePlay() {
  if (freePlayUnlocked) return;

  freePlayUnlocked = true;
  localStorage.setItem("narroFreePlayUnlocked", "true");

  freePlayMainBtn.disabled = false;
  freePlayMainBtn.style.opacity = "1";
  freePlayMainBtn.style.pointerEvents = "auto";
}

// Toggle mode buttons
freePlayMainBtn.addEventListener("click", () => {
  if (!freePlayUnlocked) return; // safety
  setFreePlayModesOpen(freePlayModes.style.display !== "flex");
});

// Start free play when a mode button is clicked
freePlayModeBtns.forEach(btn => {
  btn.addEventListener("click", () => {
    const mode = btn.dataset.mode;
    startFreePlay(mode, { restore: true });
    setFreePlayModesOpen(false);
  });
});

document.addEventListener("click", (e) => {
  if (!freePlayPanel.contains(e.target) && !e.target.closest("#resultModesBtn")) {
    setFreePlayModesOpen(false);
  }
});

/* CHALLENGE_RULES_START */
// Shared protocol rules. Embedded into the single-file web build without dependencies.
const CHALLENGE_RULES_VERSION = 'narro-daily-v1';
const CHALLENGE_MAX_GUESSES = 6;
const CHALLENGE_NICKNAME_LIMIT = 24;
const CHALLENGE_ID_PATTERN = /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;

function parseChallengeId(value) {
  return typeof value === 'string' && CHALLENGE_ID_PATTERN.test(value) ? value.toLowerCase() : null;
}
function challengePuzzleDate(instant = new Date()) {
  const parts = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(instant);
  const value = kind => parts.find(part => part.type === kind).value;
  return `${value('year')}-${value('month')}-${value('day')}`;
}
function validChallengeDate(value) {
  if (typeof value !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
  const date = new Date(`${value}T12:00:00Z`);
  return Number.isFinite(date.getTime()) && date.toISOString().slice(0, 10) === value;
}
function normalizeChallengeMetadata(value, { today, historical = false } = {}) {
  const fields = ['nickname', 'puzzleDate', 'result', 'guessCount', 'hintUsed', 'rulesVersion'];
  if (!value || typeof value !== 'object' || Array.isArray(value) || Object.keys(value).some(key => !fields.includes(key))) throw new Error('invalid_challenge');
  if (value.nickname != null && typeof value.nickname !== 'string') throw new Error('invalid_nickname');
  if (/[\u0000-\u001f\u007f-\u009f\ud800-\udfff]/u.test(value.nickname || '')) throw new Error('invalid_nickname');
  const nickname = (value.nickname || '').normalize('NFC').trim() || 'A friend';
  if (Array.from(nickname).length > CHALLENGE_NICKNAME_LIMIT || /[\u0000-\u001f\u007f-\u009f\ud800-\udfff]/u.test(nickname)) throw new Error('invalid_nickname');
  if (!validChallengeDate(value.puzzleDate)) throw new Error('invalid_date');
  if (!['win', 'lose'].includes(value.result) || !Number.isInteger(value.guessCount) || value.guessCount < 1 || value.guessCount > CHALLENGE_MAX_GUESSES || value.result === 'lose' && value.guessCount !== CHALLENGE_MAX_GUESSES) throw new Error('invalid_score');
  if (typeof value.hintUsed !== 'boolean' || value.hintUsed && value.guessCount < CHALLENGE_MAX_GUESSES - 1) throw new Error('invalid_hint');
  if (typeof value.rulesVersion !== 'string' || !/^[a-z0-9-]{1,48}$/.test(value.rulesVersion)) throw new Error('incompatible_rules');
  if (!historical) {
    if (value.rulesVersion !== CHALLENGE_RULES_VERSION) throw new Error('incompatible_rules');
    if (today && value.puzzleDate !== today) throw new Error(value.puzzleDate > today ? 'future_challenge' : 'expired_challenge');
  }
  return { nickname, puzzleDate: value.puzzleDate, result: value.result, guessCount: value.guessCount, hintUsed: value.hintUsed, rulesVersion: value.rulesVersion };
}
function normalizePublicChallenge(value) {
  if (!value || !parseChallengeId(value.id)) throw new Error('invalid_challenge');
  const { id, ...metadata } = value;
  return { id: parseChallengeId(id), ...normalizeChallengeMetadata(metadata, { historical: true }) };
}
function classifyChallenge(challenge, today) {
  if (challenge.rulesVersion !== CHALLENGE_RULES_VERSION) return 'incompatible_rules';
  if (challenge.puzzleDate > today) return 'future_challenge';
  if (challenge.puzzleDate < today) return 'expired_challenge';
  return 'current';
}
function compareChallengeScores(challenger, recipient) {
  if (challenger.puzzleDate !== recipient.puzzleDate || challenger.rulesVersion !== recipient.rulesVersion || challenger.rulesVersion !== CHALLENGE_RULES_VERSION) throw new Error('incompatible_comparison');
  if (challenger.result !== recipient.result) return recipient.result === 'win' ? 'recipient' : 'challenger';
  if (recipient.result === 'lose' || recipient.guessCount === challenger.guessCount) return 'draw';
  return recipient.guessCount < challenger.guessCount ? 'recipient' : 'challenger';
}

function buildFeedbackURL() {
  const params = new URLSearchParams({
    // Visible fields — intentionally left blank for the user to fill:
    "entry.988877110": "", // What happened?
    "entry.1336918974": "", // Anything else?

    // Hidden / auto-filled context:
    "entry.909946340": "v1.0",                   // Game version (update if sub-versioned)
    "entry.1673867347": guesses.length.toString(), // Guess count
    "entry.1628779265": min.toString(),          // Min range
    "entry.1848599252": max.toString(),          // Max range
    "entry.248208487": lifelineUsed ? "Yes" : "No", // Hint used
    "entry.1083390692": navigator.userAgent,     // Device/browser
    "entry.1109071094": `${window.innerWidth}x${window.innerHeight}`, // Screen size
    "entry.311602990": new Date().toISOString()  // Timestamp
  });

  return `${FEEDBACK_FORM_URL}?${params.toString()}`;
}

function seededNumber(seed) {
  // Hash the seed string into a 32-bit integer
  let h = 2166136261;
  for (let i = 0; i < seed.length; i++) {
    h ^= seed.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }

  // Mulberry32 PRNG (deterministic, decorrelated)
  function mulberry32(a) {
    return function () {
      let t = (a += 0x6D2B79F5);
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const rand = mulberry32(h)();
  return Math.floor(rand * MAX_RANGE) + 1;
}

function isFinalGuess() {
  return guesses.length === maxGuessesForMode() - 1;
}

function normalizeLanguageCode(rawValue) {
  return String(rawValue || "")
    .trim()
    .toLowerCase()
    .replace(/_/g, "-");
}

function resolveSupportedLanguage(rawValue) {
  const normalized = normalizeLanguageCode(rawValue);
  if (!normalized) return null;
  if (LANGUAGE_META[normalized]) return normalized;
  if (LANGUAGE_ALIASES[normalized]) return LANGUAGE_ALIASES[normalized];

  const parts = normalized.split("-");
  if (parts.length > 1) {
    const composite = `${parts[0]}-${parts[1]}`;
    if (LANGUAGE_META[composite]) return composite;
    if (LANGUAGE_ALIASES[composite]) return LANGUAGE_ALIASES[composite];
  }

  const base = parts[0];
  return LANGUAGE_META[base] ? base : null;
}

function detectPreferredLanguage() {
  const browserLanguages = Array.isArray(navigator.languages) && navigator.languages.length
    ? navigator.languages
    : [navigator.language, navigator.userLanguage].filter(Boolean);

  for (const browserLanguage of browserLanguages) {
    const supportedLanguage = resolveSupportedLanguage(browserLanguage);
    if (supportedLanguage) return supportedLanguage;
  }

  return DEFAULT_LANGUAGE;
}

let currentLanguage = resolveSupportedLanguage(localStorage.getItem(LANGUAGE_STORAGE_KEY)) ||
  detectPreferredLanguage();

for (const [language, pack] of Object.entries(CHALLENGE_MESSAGES)) {
  for (const [key, template] of Object.entries(pack)) MESSAGES[language][key] = vars => template.replace(/\{(\w+)\}/g, (_, name) => vars[name] ?? '');
}

function getMessage(key, vars = {}, language = currentLanguage) {
  const pack = MESSAGES[language] || MESSAGES[DEFAULT_LANGUAGE];
  const fallbackPack = MESSAGES[DEFAULT_LANGUAGE];
  const template = pack[key] ?? fallbackPack[key] ?? "";
  return typeof template === "function" ? template(vars) : template;
}

function formatNumber(value, language = currentLanguage) {
  const locale = LANGUAGE_META[language]?.locale || LANGUAGE_META[DEFAULT_LANGUAGE].locale;
  return new Intl.NumberFormat(locale).format(value);
}

function formatCountdownUnit(value) {
  return String(value).padStart(2, "0");
}

function clearValidation() {

  validationError.textContent = getMessage("allowedWhole", { min: formatNumber(min), max: formatNumber(max) });

function getModeRules() {
  if (currentMode === MODES.INVERTED) return getMessage("invertedRule");
  const range = getModeRange();
  const limit = maxGuessesForMode();
  const allowance = !Number.isFinite(limit) ? getMessage("unlimitedGuesses") : limit === 1 ? getMessage("oneGuess") : getMessage("guessAllowance", { count: formatNumber(limit) });
  const hintRule = hintAllowed && (currentMode === MODES.DAILY || currentMode === MODES.CLASSIC)
    ? ` ${getMessage("hintRule", { count: formatNumber(HINT_GUESSES_REMAINING) })}` : "";
  return `${getMessage("rangeRule", { min: formatNumber(range.min), max: formatNumber(range.max) })} ${allowance}${hintRule}`;

function renderGuessHistory() {

function normalizeResultBoard(context, lastGuess, answer, range) {
  if (!context || !Number.isInteger(context.min) || !Number.isInteger(context.max) || !Number.isInteger(context.guess)) return null;
  if (context.min < range.min || context.max > range.max || context.min > context.max || context.guess !== lastGuess || context.guess < context.min || context.guess > context.max || answer < context.min || answer > context.max) return null;
  return { min: context.min, max: context.max, guess: context.guess };
}

function renderResultBoard() {
  const board = document.getElementById("resultBoard");
  const context = finalGuessContext;
  board.hidden = !gameOver || !context;
  if (board.hidden) { board.removeAttribute("aria-label"); return; }
  const percent = number => context.max === context.min ? 50 : (number - context.min) / (context.max - context.min) * 100;
  const answerPercent = percent(secret), guessPercent = percent(context.guess);
  const combined = context.guess === secret;
  board.classList.toggle("combined", combined);
  board.classList.toggle("near-markers", !combined && Math.abs(answerPercent - guessPercent) < 18);
  board.dataset.outcome = gameResult;
  document.getElementById("resultMin").textContent = formatNumber(context.min);
  document.getElementById("resultMax").textContent = formatNumber(context.max);
  board.setAttribute("aria-label", getMessage("resultRangeAria", { min: formatNumber(context.min), max: formatNumber(context.max), answer: formatNumber(secret), guess: formatNumber(context.guess) }));
  for (const [markerId, labelId, position, value, key] of [["answerMarker", "answerCallout", answerPercent, secret, combined ? "combinedMarker" : "answerLabel"], ["finalMarker", "finalCallout", guessPercent, context.guess, "finalGuessLabel"]]) {
    const marker = document.getElementById(markerId), label = document.getElementById(labelId);
    marker.hidden = label.hidden = combined && markerId === "finalMarker";
    marker.style.left = label.style.left = `${Math.max(0, Math.min(100, position))}%`;
    label.classList.toggle("edge-left", position < 30);
    label.classList.toggle("edge-right", position > 70);
    label.textContent = getMessage(key, { value: formatNumber(value) });
  }
}

function saveFreePlayResult() {
  if (!gameOver || currentMode === MODES.DAILY) return;
  const state = { mode: currentMode, result: gameResult, secret, guesses: guesses.slice(), history: roundGuessHistory.slice(), lifelineUsed, lifelineGuessIndex, resultBoard: finalGuessContext, millionGuessCounter, lastInvertedMiss };
  try { localStorage.setItem(`narroFreePlayResult-${currentMode}`, JSON.stringify(state)); }
  catch (_) { /* A storage limit must not prevent replay or sharing. */ }
}

function restoreFreePlayResult(mode) {
  if (![MODES.CLASSIC, MODES.MILLION, MODES.MICRO, MODES.INVERTED].includes(mode)) return false;
  let state;
  try { state = JSON.parse(localStorage.getItem(`narroFreePlayResult-${mode}`) || "null"); } catch (_) { return false; }
  const range = getModeRange(mode);
  if (!state || state.mode !== mode || !["win", "lose"].includes(state.result) || !Number.isInteger(state.secret) || state.secret < range.min || state.secret > range.max || !Array.isArray(state.guesses) || !Array.isArray(state.history) || !state.history.length || state.history.some(g => !Number.isInteger(g) || g < range.min || g > range.max) || state.guesses.some(g => !Number.isInteger(g) || g < range.min || g > range.max)) return false;
  const limit = mode === MODES.CLASSIC ? MAX_GUESSES : mode === MODES.MILLION ? Infinity : 1;
  if (state.history.length > limit || mode === MODES.MILLION && state.millionGuessCounter !== state.history.length) return false;
  cancelDemo(); clearContextMessages(); stopCelebration(); teardownInvertedInteraction();
  currentMode = mode; gameOver = true; gameResult = state.result; secret = state.secret;
  guesses = state.guesses.slice(); roundGuessHistory = state.history.slice();
  lifelineUsed = !!state.lifelineUsed; lifelineGuessIndex = state.lifelineGuessIndex;
  finalGuessContext = normalizeResultBoard(state.resultBoard, state.history.at(-1), secret, range);
  min = finalGuessContext?.min ?? range.min; max = finalGuessContext?.max ?? range.max;
  MAX_GUESSES_OVERRIDE = limit; hintAllowed = mode === MODES.CLASSIC;
  millionGuessCounter = mode === MODES.MILLION ? state.history.length : 0;
  lastInvertedMiss = mode === MODES.INVERTED ? Math.abs(state.history[0] - secret) : null;
  gameOverDisplaySource = "restored"; sessionRecorded = true;
  input.disabled = btn.disabled = true;
  bar.className = "bar"; barFill.className = "bar-fill";
  localStorage.setItem("narroLastMode", mode);
  updateMillionGuessDisplay(); renderGameOverState(); focusActiveControl();
  return true;
}

/* Inverted exposes position along the bar, never a pre-commit number readout. */
function getBoardTravelRect() {
  return boardTravel.getBoundingClientRect();
}

function boardPercentFromClientX(clientX, rect = getBoardTravelRect()) {
  return Math.max(0, Math.min(100, (clientX - rect.left) / Math.max(1, rect.width) * 100));
}

function setInvertedPosition(percent) {
  percent = Math.max(0, Math.min(100, percent));
  barOrb.style.left = `${percent}%`;
  barOrb.setAttribute("aria-valuenow", String(Math.round(percent)));
  barOrb.setAttribute("aria-valuetext", getMessage("placementPercent", { percent: formatNumber(Math.round(percent)) }));
}

function commitInvertedPlacement() {
  if (currentMode !== MODES.INVERTED || gameOver) return;
  const percent = Number.parseFloat(barOrb.style.left) || 0;
  const placedNumber = Math.max(min, Math.min(max, Math.round(min + percent / 100 * (max - min))));
  if (cleanupInvertedDrag) cleanupInvertedDrag();
  finalGuessContext = { min, max, guess: placedNumber };
  roundGuessHistory = [placedNumber];
  const miss = Math.abs(placedNumber - secret);
  lastInvertedMiss = miss;
  gameOver = true;
  gameResult = miss === 0 ? "win" : "lose";
  barOrb.style.transition = "left 0.16s cubic-bezier(0.22, 1, 0.36, 1)";
  setInvertedPosition((placedNumber - min) / (max - min) * 100);
  barOrb.classList.remove("inverted-active");
  barOrb.style.cursor = "default";
  if (miss === 0) {
    bar.classList.add("win");
    barFill.classList.add("win");
    barOrb.classList.add("win-pulse");
    celebrationTimer = setTimeout(stopCelebration, 2800);
    haptic([12, 40, 12]);
  } else {
    if (miss === 1) {
      bar.classList.add("near");
      barFill.classList.add("near");
    }
    haptic(miss <= 3 ? [8, 24, 8] : 10);
  }
  renderGameOverState();
  recordGameSession();
}

function setupInvertedInteraction() {
  barOrb.setAttribute("role", "slider");
  barOrb.setAttribute("tabindex", "0");
  barOrb.setAttribute("aria-valuemin", "0");
  barOrb.setAttribute("aria-valuemax", "100");
  setInvertedPosition(50);
  barOrb.onkeydown = event => {
    if (gameOver) return;
    const step = event.shiftKey ? 10 : 1;
    const position = Number.parseFloat(barOrb.style.left) || 0;
    const positions = { ArrowLeft: position - step, ArrowDown: position - step, ArrowRight: position + step, ArrowUp: position + step, Home: 0, End: 100, PageDown: position - 10, PageUp: position + 10 };
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      commitInvertedPlacement();
    } else if (event.key in positions) {
      event.preventDefault();
      setInvertedPosition(positions[event.key]);
    }
  };
  invertedCommitBtn.onclick = commitInvertedPlacement;
  barOrb.onpointerdown = event => {
    if (gameOver) return;
    event.preventDefault();
    const rect = getBoardTravelRect();
    if (!rect.width) return;
    const pointerId = event.pointerId;
    barOrb.style.transition = "none";
    const move = e => setInvertedPosition(boardPercentFromClientX(e.clientX, rect));
    const cleanup = () => {
      window.removeEventListener("pointermove", drag);
      window.removeEventListener("pointerup", drop);
      window.removeEventListener("pointercancel", cancel);
      if (barOrb.hasPointerCapture?.(pointerId)) {
        try { barOrb.releasePointerCapture(pointerId); } catch {}
      }
      cleanupInvertedDrag = null;
    };
    const drag = e => { if (!gameOver && e.pointerId === pointerId) move(e); };
    const drop = e => {
      if (e.pointerId !== pointerId) return;
      cleanup();
      if (gameOver) return;
      move(e);
      commitInvertedPlacement();
    };
    const cancel = e => {
      if (e.pointerId !== pointerId) return;
      cleanup();
      barOrb.style.transition = "left 0.2s ease";
    };
    try { barOrb.setPointerCapture(pointerId); } catch {}
    window.addEventListener("pointermove", drag);
    window.addEventListener("pointerup", drop);
    window.addEventListener("pointercancel", cancel);
    cleanupInvertedDrag = cleanup;
  };
}

function refreshHelp() {
  if (helpModal.hidden || !practiceState) return;
  const phase = practiceState.phase;
  const independent = phase === "estimate" || phase === "result";
  const practiceMin = independent ? PRACTICE_RANGE.min : MIN_RANGE;
  const practiceMax = independent ? PRACTICE_RANGE.max : phase === "narrowed" ? DEMO_FIRST_GUESS - 1 : MAX_RANGE;
  const target = independent ? PRACTICE_SECRET : DEMO_SECRET_EXAMPLE;
  const position = (target - practiceMin) / (practiceMax - practiceMin) * 100;
  document.getElementById("helpTitle").textContent = getMessage("practiceTitle");
  document.getElementById("helpCopy").hidden = true;
  document.getElementById("helpDemo").hidden = false;
  document.getElementById("helpDemoMin").textContent = formatNumber(practiceMin);
  document.getElementById("helpDemoMax").textContent = formatNumber(practiceMax);
  document.getElementById("helpDemoOrb").style.left = `${position}%`;
  document.getElementById("helpRangeCopy").textContent = getMessage(phase === "demo" ? "orbRelative" : phase === "narrowed" ? "endpointsChanged" : phase === "estimate" ? "practicePrompt" : "practicePosition");
  document.getElementById("helpDemoBar").setAttribute("aria-label", `${getMessage("remainingRangeAria", { min: formatNumber(practiceMin), max: formatNumber(practiceMax) })}. ${getMessage("placementPercent", { percent: formatNumber(Math.round(position)) })}`);
  const form = document.getElementById("practiceForm");
  form.hidden = phase !== "estimate";
  const estimateInput = document.getElementById("practiceInput");
  estimateInput.min = PRACTICE_RANGE.min; estimateInput.max = PRACTICE_RANGE.max;
  estimateInput.placeholder = getMessage("estimateLabel");
  document.getElementById("practiceInputLabel").textContent = getMessage("estimateLabel");
  document.getElementById("practiceSubmitBtn").textContent = getMessage("estimateButton");
  document.getElementById("practiceResult").hidden = phase !== "result";
  if (phase === "result") {
    const distance = Math.abs(practiceState.guess - PRACTICE_SECRET);
    document.getElementById("practiceOutcome").textContent = getMessage(distance === 0 ? "exactlyRight" : "practiceAway", { distance: formatNumber(distance) });
    document.getElementById("practiceNumbers").textContent = getMessage("practiceNumbers", { guess: formatNumber(practiceState.guess), answer: formatNumber(PRACTICE_SECRET) });
  }
  const next = document.getElementById("helpDemoBtn");
  next.hidden = phase === "estimate";
  next.textContent = getMessage(phase === "demo" ? "tryValue" : phase === "narrowed" ? "yourTurnAction" : "playToday", { value: formatNumber(DEMO_FIRST_GUESS) });
  document.getElementById("helpCloseBtn").textContent = getMessage(practiceState.firstTime ? "skipPractice" : "close");
}

function advancePractice() {
  if (!practiceState) return;
  if (practiceState.phase === "result") {
    const firstTime = practiceState.firstTime;
    closeHelp(false);
    if (firstTime || currentMode !== MODES.DAILY) startDailyMode();
    else focusActiveControl();
    return;
  }
  practiceState.phase = practiceState.phase === "demo" ? "narrowed" : "estimate";
  clearPracticeError();
  document.getElementById("practiceInput").value = "";
  refreshHelp();
  if (practiceState.phase === "estimate") document.getElementById("practiceInput").focus();
}

function submitPracticeEstimate() {
  if (practiceState?.phase !== "estimate") return;
  const estimateInput = document.getElementById("practiceInput");
  const raw = estimateInput.value.trim(), estimate = Number(raw);
  if (!raw || !Number.isInteger(estimate) || estimate < PRACTICE_RANGE.min || estimate > PRACTICE_RANGE.max) {
    const error = document.getElementById("practiceError");
    error.textContent = getMessage("allowedWhole", { min: formatNumber(PRACTICE_RANGE.min), max: formatNumber(PRACTICE_RANGE.max) });
    error.hidden = false; estimateInput.setAttribute("aria-invalid", "true"); estimateInput.focus(); return;
  }
  clearPracticeError();
  practiceState.guess = estimate; practiceState.phase = "result";
  if (typeof gtag === "function") gtag("event", "onboarding_estimate", { correct: estimate === PRACTICE_SECRET, source: practiceState.firstTime ? "first_time" : "how_to_play" });
  refreshHelp();
  document.getElementById("helpDemoBtn").focus();
}

function closeHelp(restoreFocus = true) {
  if (helpModal.hidden) return;
  const firstTime = practiceState?.firstTime;
  practiceState = null; demoRunning = false; demoTutorialState = null;
  helpModal.hidden = true; helpModal.style.display = "none";
  if (firstTime) markDemoSeen();
  gameShell.inert = false;
  clearPracticeError();
  if (restoreFocus && helpReturnFocus?.isConnected) helpReturnFocus.focus();
  helpReturnFocus = null;
  if (firstTime) { clearFeedbackMessage(); clearTipMessage(); updateGuessUI(); focusActiveControl(); }
}

function updateCountdownText() {
  const now = new Date();
  const easternNow = new Date(now.toLocaleString("en-US", { timeZone: "America/New_York" }));
  const nextMidnight = new Date(easternNow);
  nextMidnight.setHours(24, 0, 0, 0);
  const diff = nextMidnight - easternNow;
  const h = Math.floor(diff / 36e5);
  const m = Math.floor((diff % 36e5) / 6e4);
  const s = Math.floor((diff % 6e4) / 1000);
  const timeText =
    `${formatCountdownUnit(h)}<span class="colon-blink">:</span>` +
    `${formatCountdownUnit(m)}<span class="colon-blink">:</span>` +
    `${formatCountdownUnit(s)}`;
  countdown.innerHTML = getMessage("nextPuzzleIn", { time: timeText });
  if (dailyChallenge?.metadata && challengePuzzleDate() !== todayKey) renderDailyChallenge();
}

  updateThemeToggle(normalizedTheme);
  if (!persist) return;

/* ---------- INPUT EVENTS ---------- */
let allowSubmitBlur = false;
let lastPointerDownTarget = null;
let lastPointerDownX = null;
let lastPointerDownY = null;

function rememberLastTapTarget(e) {
  let target = e.target;

  if (!(target instanceof Element) && target?.parentElement) {
    target = target.parentElement;
  }

  lastPointerDownTarget = target instanceof Element ? target : null;

  if (typeof e.clientX === "number" && typeof e.clientY === "number") {
    lastPointerDownX = e.clientX;
    lastPointerDownY = e.clientY;
  } else if (e.touches?.[0]) {
    lastPointerDownX = e.touches[0].clientX;
    lastPointerDownY = e.touches[0].clientY;
  }
}

document.addEventListener("pointerdown", rememberLastTapTarget, true);
document.addEventListener("touchstart", rememberLastTapTarget, true);

function shouldRetainKeyboardOnBlur() {
  if (!isMobile()) return false;
  if (allowSubmitBlur) return false;

  let tapTarget = lastPointerDownTarget;
  if (
    !(tapTarget instanceof Element) &&
    Number.isFinite(lastPointerDownX) &&
    Number.isFinite(lastPointerDownY)
  ) {
    tapTarget = document.elementFromPoint(lastPointerDownX, lastPointerDownY);
  }
  if (!(tapTarget instanceof Element)) return false;
  if (tapTarget.closest("#guessBtn") && !gameOver) return true;

  const value = String(input.value ?? "").trim();
  if (!value) return false;

  const appRoot = document.querySelector(".app");
  if (!appRoot) return false;

  const appRect = appRoot.getBoundingClientRect();
  const tapInsideAppRect =
    Number.isFinite(lastPointerDownX) &&
    Number.isFinite(lastPointerDownY) &&
    lastPointerDownX >= appRect.left &&
    lastPointerDownX <= appRect.right &&
    lastPointerDownY >= appRect.top &&
    lastPointerDownY <= appRect.bottom;

  if (!appRoot.contains(tapTarget) && !tapInsideAppRect) return false;

  // Allow blur on intentional controls/taps; retain only for accidental
  // non-interactive taps on the app surface.
  if (
    tapTarget.closest(
      "button, input, select, .bar, .stats-btn, #languageMenu, #statsModal"
    )
  ) {
    return false;
  }

  return true;
}

input.addEventListener("blur", () => {
  if (shouldRetainKeyboardOnBlur()) {
    setTimeout(() => {
      if (document.activeElement !== input && !gameOver) {
        try {
          input.focus({ preventScroll: true });
        } catch {
          input.focus();
        }
      }
    }, 0);
    return;
  }

  handleKeyboardBlur();
  allowSubmitBlur = false;
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    if (!btn.disabled) btn.click();
  }
});

/* ---------- SAVED STATE RESTORE ---------- */
function clearTodayDailyState() {
  localStorage.removeItem(dailyStateKey);
  localStorage.removeItem(dailyStateKey + "-result");
}

function normalizeDailySavedState(rawState) {
  if (!rawState || typeof rawState !== "object") return null;

  const mode = rawState.mode || MODES.DAILY;
  if (mode !== MODES.DAILY) return null;

  const result =
    rawState.result === "win" || rawState.result === "lose"
      ? rawState.result
      : null;

  if (!Array.isArray(rawState.guesses)) return null;
  const savedGuesses = rawState.guesses.map(Number);
  if (
    savedGuesses.some(
      g => !Number.isInteger(g) || g < MIN_RANGE || g > MAX_RANGE
    )
  ) {
    return null;
  }
  if (savedGuesses.length > MAX_GUESSES) return null;

  const lifelineUsed = !!rawState.lifelineUsed;
  let lifelineGuessIndex = null;
  if (
    Number.isInteger(rawState.lifelineGuessIndex) &&
    rawState.lifelineGuessIndex >= 0 &&
    rawState.lifelineGuessIndex <= savedGuesses.length
  ) {
    lifelineGuessIndex = rawState.lifelineGuessIndex;
  }

  const hasRange =
    Number.isInteger(rawState.min) &&
    Number.isInteger(rawState.max) &&
    rawState.min >= MIN_RANGE &&
    rawState.max <= MAX_RANGE &&
    rawState.min <= rawState.max;

  // In-progress state must carry a valid range and cannot be exhausted.
  if (result == null) {
    if (!hasRange) return null;
    if (savedGuesses.length >= MAX_GUESSES) return null;
  }

  return {
    mode: MODES.DAILY,
    result,
    resultBoard: normalizeResultBoard(rawState.resultBoard, savedGuesses.at(-1), seededNumber(todayKey), { min: MIN_RANGE, max: MAX_RANGE }),
    guesses: savedGuesses,
    lifelineUsed,
    lifelineGuessIndex,
    min: hasRange ? rawState.min : MIN_RANGE,
    max: hasRange ? rawState.max : MAX_RANGE
  };
}

const savedState = localStorage.getItem(dailyStateKey);
let parsedSavedState = null;

if (savedState) {
  try {
    parsedSavedState = normalizeDailySavedState(JSON.parse(savedState));
    if (!parsedSavedState) {
      console.warn("Saved daily state failed validation; resetting daily state");
      clearTodayDailyState();
      dailyResult = null;
    }
  } catch (err) {
    console.warn("Saved state was invalid JSON; resetting daily state", err);
    clearTodayDailyState();
    dailyResult = null;
  }
}

if (parsedSavedState) restoreDailyState(parsedSavedState);

function restoreDailyState(state) {
  demoMode = false;
  demoRunning = false;
  currentMode = MODES.DAILY;
  MAX_GUESSES_OVERRIDE = null;
  secret = seededNumber(todayKey);
  gameOver = state.result === "win" || state.result === "lose";
  gameResult = state.result;
  dailyResult = state.result;
  gameOverDisplaySource = "restored";
  sessionRecorded = gameOver;
  guesses = state.guesses.slice();
  roundGuessHistory = state.guesses.slice();
  lifelineUsed = state.lifelineUsed;
  lifelineGuessIndex = state.lifelineGuessIndex;
  finalGuessContext = state.resultBoard;
  min = gameOver ? MIN_RANGE : state.min;
  max = gameOver ? MAX_RANGE : state.max;
  hintAnimating = false;
  hintVisible = false;
  hintAllowed = true;
  lastDirectionalGuess = !gameOver && guesses.length ? guesses.at(-1) : null;
  bar.className = "bar";
  bar.classList.toggle("hinted", lifelineUsed && !gameOver);
  bar.classList.toggle("win", gameResult === "win");
  barFill.className = "bar-fill";
  barFill.classList.toggle("win", gameResult === "win");
  input.disabled = gameOver;
  btn.disabled = gameOver;
  if (gameOver) unlockFreePlay();
  else localStorage.removeItem(dailyStateKey + "-result");
  updateBar();
  syncInputRange();
  updateShareButton();
  if (gameOver) renderGameOverState();
  else updateGuessUI();
  refreshRoundUI();
}

if (!demoMode && !gameOver && !lifelineUsed) {

function persistDailyProgress() {
  if (currentMode !== MODES.DAILY || gameOver) return;

  try {
    localStorage.setItem(

      })
    );
    localStorage.removeItem(dailyStateKey + "-result");
  } catch (err) {
    console.warn("Failed to persist in-progress daily state", err);
  }
}

/* ---------- HAPTICS ---------- */
function haptic(pattern) {
  if ("vibrate" in navigator) {
    navigator.vibrate(pattern);
  }
}

async function recordGameSession() {
  if (sessionRecorded || !gameOver || !supabaseClient || !gameStartTime) return;
  sessionRecorded = true;

  const totalGuesses =
    currentMode === MODES.MILLION
      ? millionGuessCounter
      : currentMode === MODES.INVERTED && (gameResult === "win" || gameResult === "lose")
        ? 1
        : guesses.length;

  try {
    await supabaseClient.from("game_sessions").insert({
      user_id: anonUserId,
      mode: currentMode,
      won: gameResult === "win",
      guesses: totalGuesses,
      time_ms: Math.max(0, Date.now() - gameStartTime),
      range_history: null,
      perfect_game: gameResult === "win" && totalGuesses === 1
    });
  } catch (err) {
    console.error("Supabase insert failed", err);
  }
}

// ---------- MOBILE AUTO SCROLL ----------
function isMobile() {
  return /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
}

function isIOSDevice() {
  return /iPad|iPhone|iPod/i.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}

function setOrbTrackingTransition(leftSeconds) {
  if (window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches) {
    barOrb.style.setProperty("transition-duration", "0s", "important");
    return;
  }
  barOrb.style.removeProperty("transition-duration");
  const duration = Number.isFinite(leftSeconds)
    ? Math.max(0.08, leftSeconds)
    : 0.5;
  const durationText = `${duration.toFixed(3)}s`;

  barOrb.style.transition =
    `left ${durationText} cubic-bezier(0.18, 0.88, 0.26, 1), filter 0.24s ease-out, box-shadow 0.24s ease-out`;

  // Preserve smooth iOS tracking only when motion has not been reduced.
  if (isIOSDevice()) {
    barOrb.style.setProperty(
      "transition-duration",
      `${durationText}, 0.24s, 0.24s`,
      "important"
    );
  }
}

function getViewportHeight() {
  return window.visualViewport?.height || window.innerHeight;
}

let keyboardViewportBaseline = getViewportHeight();

function applyKeyboardInset() {
  const inset = Math.max(0, keyboardViewportBaseline - getViewportHeight());
  document.documentElement.style.setProperty("--keyboard-inset", `${inset}px`);
  return inset;
}

function ensurePlayableSectionVisible(behavior = "smooth") {
  const playable = document.querySelector(".bar-wrap");
  if (!playable) return;

  const viewportHeight = getViewportHeight();
  const rect = playable.getBoundingClientRect();
  const topPadding = 12;
  const bottomPadding = 16;
  const bottomLimit = viewportHeight - bottomPadding;

  if (rect.top >= topPadding && rect.bottom <= bottomLimit) {
    return;
  }

  const targetY =
    window.scrollY +
    rect.top -
    Math.max(topPadding, (viewportHeight - rect.height) * 0.36);

  window.scrollTo({
    top: Math.max(0, targetY),
    behavior
  });
}

function handleKeyboardFocus() {
  if (!isMobile()) return;

  keyboardViewportBaseline = Math.max(keyboardViewportBaseline, getViewportHeight());
  document.body.classList.add("keyboard-open");
  applyKeyboardInset();

  setTimeout(() => {
    applyKeyboardInset();
    ensurePlayableSectionVisible("smooth");
  }, 140);

  setTimeout(() => {
    applyKeyboardInset();
    ensurePlayableSectionVisible("smooth");
  }, 360);
}

function handleKeyboardBlur() {
  document.body.classList.remove("keyboard-open");
  document.documentElement.style.setProperty("--keyboard-inset", "0px");

  if (!isMobile()) return;
  setTimeout(() => {
    keyboardViewportBaseline = getViewportHeight();
  }, 120);
}

if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", () => {
    if (!isMobile()) return;

    if (document.activeElement === input) {
      applyKeyboardInset();
      ensurePlayableSectionVisible("auto");
    } else {
      keyboardViewportBaseline = getViewportHeight();
    }
  });
}

window.addEventListener("orientationchange", () => {
  setTimeout(() => {
    keyboardViewportBaseline = getViewportHeight();

    if (document.activeElement === input && isMobile()) {
      applyKeyboardInset();
      ensurePlayableSectionVisible("auto");
    }
  }, 120);
});

input.addEventListener("focus", () => {
  input.select();

  handleKeyboardFocus();
});

function activateHintOrb() {
  if (!barOrb) return;

  barOrb.classList.add("hint-shine");

  // Remove the class after animation completes
  setTimeout(() => {
    barOrb.classList.remove("hint-shine");
  }, 2700); // 0.9s * 3 cycles
}

function maybeShowOrbTip() {
  if (!gameOver && !lifelineUsed && !tipShown) {
    tipText.classList.remove("hint");
    setTipMessage("followOrbTip");
    tipText.style.opacity = "1";
    tipText.style.display = "block";
    activateHintOrb();
    tipShown = true;
  }
}

/* ---------- FREE PLAY ---------- */
function startFreePlay(mode, options = {}) {
  if (options.restore && restoreFreePlayResult(mode)) return;
  localStorage.setItem("narroLastMode", mode);
  localStorage.removeItem(`narroFreePlayResult-${mode}`);
  if (![MODES.CLASSIC, MODES.MILLION, MODES.MICRO, MODES.INVERTED].includes(mode)) return;
  cancelDemo();
  clearContextMessages();
  stopCelebration();
  Object.keys(sentimentState).forEach(k => sentimentState[k] = false);
  sentimentState.lastGuessHadSentiment = false;
  teardownInvertedInteraction();
  setFreePlayModesOpen(false);
  setGuessButtonLabel();
  setOnboardingVisible(false);

  currentMode = mode;
  gameOver = false;
  gameResult = null;
  guesses = [];
  roundGuessHistory = [];
  lastInvertedMiss = null;
  lifelineUsed = false;
  lifelineGuessIndex = null;
  hintAnimating = false;
  hintVisible = false;
  bar.classList.remove("hinted", "hint-ready");
  gameStartTime = Date.now();
  sessionRecorded = false;
  lastDirectionalGuess = null;
  gameOverDisplaySource = "live";
  tipText.hidden = false;

  // Hard reset visuals
  bar.className = "bar";
  bar.classList.remove("near");
  barFill.className = "bar-fill";
  barFill.classList.remove("near");
  clearFeedbackMessage();
  clearGuessCountMessage();
  input.disabled = false;
  btn.disabled = false;
  updateShareButton();

   // Hide “Want more Narro? Try Free Play!” once a free play game starts
  if (tipText) {
    tipText.style.display = "none";
    clearTipMessage();
    tipText.classList.remove("hint");
  }

  // Mode-specific setup
  switch (mode) {
    case MODES.CLASSIC:
      ({ min, max } = getModeRange());
      MAX_GUESSES_OVERRIDE = MAX_GUESSES;
      secret = Math.floor(Math.random() * (max - min + 1)) + min;
      hintAllowed = true;
      break;

    case MODES.MILLION:
      ({ min, max } = getModeRange());
      MAX_GUESSES_OVERRIDE = Infinity;
      secret = Math.floor(Math.random() * (max - min + 1)) + min;
      hintAllowed = false;
      millionGuessCounter = 0;
      break;

    case MODES.MICRO:
      ({ min, max } = getModeRange());
      MAX_GUESSES_OVERRIDE = 1;
      secret = Math.floor(Math.random() * (max - min + 1)) + min;
      hintAllowed = false;
      break;

    case MODES.INVERTED:
      min = 1;
      max = INVERTED_MAX_RANGE; // one-shot but still skill-based
      MAX_GUESSES_OVERRIDE = 1;
      secret = Math.floor(Math.random() * (max - min + 1)) + min;
      hintAllowed = false;
      gameOver = false;
      gameResult = null;

      // Reset visuals
      bar.className = "bar inverted-mode";
      barFill.className = "bar-fill";
      barOrb.classList.add("inverted-active");
      barOrb.style.removeProperty("transition-duration");
      input.disabled = true;
      btn.disabled = true;

      // Show secret number (static for the round)
      setFeedbackMessage("invertedSecretNumber", { value: formatNumber(secret) });
      tipText.classList.remove("hint");
      setTipMessage("invertedInstruction");
      tipText.style.display = "block";
      tipText.style.opacity = "1";

      minLabel.textContent = formatNumber(min);
      maxLabel.textContent = formatNumber(max);

      // Start centered so it's easy to grab on mobile.
      barOrb.style.transition = "left 0.2s ease";
      barOrb.style.left = "50%";
      barOrb.style.cursor = "grab";

      setupInvertedInteraction();
    break;
    }

  // Common post-switch updates
  refreshRoundUI();
  syncInputRange();
  updateBar();
  updateOrb();
  updateGuessUI();
  updateMillionGuessDisplay();

  if (currentMode !== MODES.MILLION) {
    document.getElementById("millionPrompt").style.display = "none";
    document.getElementById("millionGuessCounter").style.display = "none";
  }
  focusActiveControl();
}

function startDailyMode() {
  localStorage.setItem("narroLastMode", MODES.DAILY);
  cancelDemo();
  clearContextMessages();
  stopCelebration();
  Object.keys(sentimentState).forEach(k => sentimentState[k] = false);
  teardownInvertedInteraction();
  setFreePlayModesOpen(false);
  setGuessButtonLabel();
  currentMode = MODES.DAILY;
  MAX_GUESSES_OVERRIDE = null;
  secret = seededNumber(todayKey);
  min = MIN_RANGE;
  max = MAX_RANGE;
  guesses = [];
  roundGuessHistory = [];
  gameOver = false;
  gameResult = null;
  lastInvertedMiss = null;
  lifelineUsed = false;
  lifelineGuessIndex = null;
  hintAnimating = false;
  hintVisible = false;
  hintAllowed = true;
  sessionRecorded = false;
  lastDirectionalGuess = null;
  gameStartTime = Date.now();
  gameOverDisplaySource = "live";
  bar.className = "bar";
  barFill.className = "bar-fill";
  input.value = "";
  input.disabled = false;
  btn.disabled = false;
  tipText.hidden = false;
  const rawState = localStorage.getItem(dailyStateKey);
  let state = null;
  try { state = rawState ? normalizeDailySavedState(JSON.parse(rawState)) : null; }
  catch (error) { console.warn("Could not restore daily state", error); }
  if (state) restoreDailyState(state);
  else {
    dailyResult = readDailyResult();
    updateBar();
    syncInputRange();
    updateGuessUI();
    refreshRoundUI();
  }
  updateMillionGuessDisplay();
  focusActiveControl();
}

function resolveFreePlayGuess(g) {
  // MICRO: instant
  if (currentMode === MODES.MICRO) {
    if (g < 1 || g > 25) {
      showToast(
        getMessage("stayInRange", {
          min: formatNumber(1),
          max: formatNumber(25)
        }),
        2000
      );
      return; // stop here, don’t end the game
    }

    guesses.push(g);
    roundGuessHistory.push(g);
    if (g === secret) endFreePlayWin();
    else endFreePlayLoss();
    input.disabled = true;
    btn.disabled = true;
    return;
}

  // MILLION: manual handling ONLY
  if (currentMode === MODES.MILLION) {

    // --- INVALID GUESS CHECK ---
    if (g < min || g > max) {
      showToast(
        getMessage("stayInRange", {
          min: formatNumber(min),
          max: formatNumber(max)
        }),
        2000
      );
      return; // do NOT increment counter or modify range
    }

    // --- VALID GUESS ---
    roundGuessHistory.push(g);
    lastDirectionalGuess = g;
    millionGuessCounter++;
    updateMillionGuessDisplay();

    // Narrow range (NO resolveGuess)
    if (g < secret) min = g + 1;
    else if (g > secret) max = g - 1;

    // Check for win
    if (g === secret || (min === max && !gameOver)) {
      secret = g === secret ? g : min; // ensure secret is correct for auto-win
      endFreePlayWin();  // trigger animation
    } else {
      updateBar();
      updateOrb();
      syncInputRange();
      refreshRoundUI();
    }

    return;
  }

  // CLASSIC / DAILY
  resolveGuess(g);
}

function triggerWinVisuals() {
  clearTimeout(celebrationTimer);
  celebrationTimer = setTimeout(stopCelebration, 2800);
  bar.offsetWidth; // force reflow for consistency
  bar.classList.add("win");
  barFill.classList.add("win");
  updateOrb();
  haptic([20, 60, 20]);
}

function endFreePlayWin() {
  if (gameOver) return;
  gameOver = true;
  gameResult = "win";
  gameOverDisplaySource = "live";
  updateShareButton();
  setFeedbackMessage("bullseye");
  input.disabled = true;
  btn.disabled = true;

  triggerWinVisuals();
  renderGameOverState();
  recordGameSession();
}

function endFreePlayLoss() {
  if (gameOver) return;
  gameOver = true;
  gameResult = "lose";
  gameOverDisplaySource = "live";
  updateShareButton();
  activeFeedbackMessage = null;
  input.disabled = true;
  btn.disabled = true;

  if (currentMode === MODES.MICRO) {
    feedback.textContent = `${getMessage("roundOver")} ${getMessage("numberWas", { value: formatNumber(secret) })}`;
  } else {
    feedback.textContent = getMessage("roundOver");
  }
  gameResult = "lose";
  renderGameOverState();
  recordGameSession();
}

function maxGuessesForMode() {
  if (MAX_GUESSES_OVERRIDE != null) return MAX_GUESSES_OVERRIDE;
  switch (currentMode) {
    case MODES.MICRO: return 1;
    case MODES.MILLION: return Infinity;
    case MODES.CLASSIC: return MAX_GUESSES;
    default: return MAX_GUESSES;
  }
}

function getModeRange(mode = currentMode) {
  switch (mode) {
    case MODES.MILLION:
      return { min: 1, max: 1_000_000 };
    case MODES.MICRO:
      return { min: 1, max: 25 };
    case MODES.INVERTED:
      return { min: 1, max: INVERTED_MAX_RANGE };
    default:
      return { min: 1, max: MAX_RANGE }; // daily + classic
  }
}

function updateMillionGuessDisplay() {
  const counter = document.getElementById("millionGuessCounter");
  const prompt = document.getElementById("millionPrompt");
  if (!counter || !prompt) return;

  if (currentMode === MODES.MILLION) {
    prompt.style.display = "block";
    counter.style.display = "block";

    prompt.textContent = getMessage("millionPrompt");
    counter.textContent = getMessage("millionCounter", {
      count: formatNumber(millionGuessCounter)
    });
  } else {
    prompt.style.display = "none";
    counter.style.display = "none";
  }
}

/* ---------- SENTIMENT ---------- */
const sentimentState = {
  inefficiencyShown: false,
  compressionShown: false,
  efficiencyShown: false,
  stakesShown: false,
  superCloseShown: false,
  lastGuessHadSentiment: false
};

function remainingRange() {
  return max - min + 1;
}

function applyWindowSnapHint() {
  const span = max - min + 1;
  if (span <= 2) return false;

  // Target width = 80% of current span
  const targetSpan = Math.max(2, Math.floor(span * 0.8));

  // Quantization step (10% of original span, minimum 5)
  const step = Math.max(5, Math.floor(span * 0.1));

  // Generate all valid snapped windows
  const windows = [];
  for (let start = min; start + targetSpan - 1 <= max; start += step) {
    const end = start + targetSpan - 1;
    if (secret > start && secret < end) {
      windows.push({ start, end });
    }
  }

  // Fallback safety (should never trigger)
  if (!windows.length) return false;

  // Deterministic pick (daily-stable)
  const idx =
    seededNumber(todayKey + "|windowHint") % windows.length;

  let { start, end } = windows[idx];

  // Absolute safety guard: never allow boundary = secret
  const modeRange = getModeRange();

  if (start >= secret) start = secret - 1;
  if (end <= secret) end = secret + 1;

  min = Math.max(modeRange.min, start);
  max = Math.min(modeRange.max, end);

  updateBar();
  updateOrb();
  syncInputRange();
  return true;
}

function guessesRemaining() {
  return maxGuessesForMode() - guesses.length;
}

function suppressSentiment() {
  return (
    demoMode ||
    gameOver ||
    sentimentState.lastGuessHadSentiment ||
    sentimentState.superCloseShown
  );
}

function emitSentiment(messageKey, isCritical = false) {
  sentimentState.lastGuessHadSentiment = true;
}

function clearSentiment() {
  clearTimeout(feedback._fadeT);
  activeSentimentMessage = null;

  feedback.style.opacity = 0;
  feedback._fadeT = setTimeout(() => {
    feedback.textContent = "";
    feedback.classList.remove("critical");
    sentimentState.lastGuessHadSentiment = false;
    feedback.style.opacity = 1;
  }, 50);
}

/* ---------- GAME PHASE ---------- */
function isEarlyGame() {
  return guesses.length <= 2 && remainingRange() > 2000;
}

function isMidGame() {
  return (
    !isEarlyGame() &&
    remainingRange() > 25 &&
    guessesRemaining() > 2
  );
}

function isLateGuessCount() {
  return guesses.length >= maxGuessesForMode() - 2;
}

function isCriticalRange() {
  return remainingRange() <= 25;
}


/* ---------- INPUT RANGE ---------- */
function syncInputRange() {
  if (!input) return;
  if (currentMode === MODES.MICRO) {
    input.min = getModeRange().min;
    input.max = getModeRange().max;
  } else {
    input.min = min ?? 1;
    input.max = max ?? MAX_RANGE;
  }
}

/* ---------- RANDOMIZED CONTEXTUAL FEEDBACK ---------- */
const feedbackPhrases = {
  earlyInefficiency: [
    "feedbackEarlyInefficiency1",
    "feedbackEarlyInefficiency2",
    "feedbackEarlyInefficiency3"
  ],
  midCompression: [
    "feedbackMidCompression1",
    "feedbackMidCompression2",
    "feedbackMidCompression3"
  ],
  efficientCut: [
    "feedbackEfficientCut1",
    "feedbackEfficientCut2",
    "feedbackEfficientCut3"
  ],
  stakes: [
    "feedbackStakes1",
    "feedbackStakes2",
    "feedbackStakes3"
  ],
  superClose: ["feedbackSuperClose1"]
};

function pickPhrase(category) {
  const arr = feedbackPhrases[category] || [];
  return arr[Math.floor(Math.random() * arr.length)] || "";
}

/* ---------- BAR ---------- */
function updateBar() {
  const rangeMax = currentMode === MODES.MILLION ? 1_000_000 :
                   currentMode === MODES.MICRO ? 25 :
                   currentMode === MODES.INVERTED ? INVERTED_MAX_RANGE :
                   MAX_RANGE;

  // Clamp min/max to valid range
  min = Math.min(Math.max(1, min), rangeMax);
  max = Math.min(Math.max(min, max), rangeMax);

  // Use (rangeMax - 1) for full scale mapping
  const left = ((min - 1) / (rangeMax - 1)) * 100;
  const width = ((max - min + 1) / (rangeMax - 1)) * 100;
  const slow = isLateGuessCount();

  if (!hintAnimating) {
    barFill.style.transition = slow
      ? "left 0.6s ease, width 0.6s ease"
      : "left 0.35s ease, width 0.35s ease";
  }

  barFill.style.left = left + "%";
  barFill.style.width = width + "%";

  const remainingRatio = (max - min + 1) / rangeMax;
  bar.classList.toggle("tight-range", !gameOver && remainingRatio <= 0.12);

  if (remainingRatio <= 0.45) {
    bar.classList.add("no-brackets");
  } else {
    bar.classList.remove("no-brackets");
  }

  bar.style.position = "relative";

  // Always-visible labels
  minLabel.style.display = "inline";
  maxLabel.style.display = "inline";

  const formattedMin = formatNumber(min);
  const formattedMax = formatNumber(max);
  minLabel.textContent = formattedMin;
  maxLabel.textContent = formattedMax;
  bar.setAttribute(
    "aria-label",
    getMessage("remainingRangeAria", {
      min: formattedMin,
      max: formattedMax
    })
  );

  const centerLabel = bar.querySelector(".center-range-label");
  if (centerLabel) centerLabel.remove();

  if (!gameOver && min === max) {
    if (min === secret) {
        win();
    } else if (currentMode === MODES.DAILY && guessesRemaining() === 0) {
        // Only auto-lose if player has no guesses left
        lose();
    }
}

  bar.style.setProperty("--fill-left", left + "%");
  bar.style.setProperty("--fill-width", Math.max(width, 0) + "%");

  updateOrb();
}

function resolveGuess(g, skipPush = false) {
  // --- 0. Reject guesses outside the current visible range ---
  if (g < min || g > max) {
    showToast(
      getMessage("stayInRange", {
        min: formatNumber(min),
        max: formatNumber(max)
      })
    );
    haptic(5);
    return; // exit early — no state changes
  }

  const prevMin = min;
  const prevMax = max;
  const prevRange = prevMax - prevMin + 1;

  if (!skipPush && currentMode !== MODES.MILLION) {
    guesses.push(g); // do not push in Million mode
    roundGuessHistory.push(g);
  }
  lastDirectionalGuess = g;
  refreshRoundUI();
  haptic(10);

  // --- 1. Check win/lose ---
  if (g === secret) {
  if (currentMode === MODES.DAILY || currentMode === MODES.CLASSIC) {
    win();
    updateGuessUI();
  }
  return;
}

  if (guesses.length >= maxGuessesForMode()) {
    lose();
    updateGuessUI();
    return;
  }

  // --- 2. Update range ---
  if (g < secret) {
    min = g + 1;
  } else if (g > secret) {
    max = g - 1;
  }

  updateBar();
  updateOrb();
  syncInputRange();

  // --- 3. Micro reward for efficient cut ---
  const newRange = max - min + 1;
  if (newRange / prevRange <= 0.6 && isMidGame()) microReward("efficient");

  // --- 4. Evaluate sentiment ---
  if (!suppressSentiment()) {
    let sentimentToShow = null;
    let isCritical = false;
    const reduction = 1 - newRange / prevRange;

    if (isEarlyGame() && !sentimentState.inefficiencyShown && reduction < 0.10) {
      if (Math.random() > 0.25) sentimentToShow = pickPhrase("earlyInefficiency");
      sentimentState.inefficiencyShown = true;
    } else if (isMidGame() && !sentimentState.compressionShown && newRange <= 2000) {
      sentimentToShow = pickPhrase("midCompression");
      sentimentState.compressionShown = true;
    } else if (isMidGame() && !sentimentState.efficiencyShown && reduction >= 0.40) {
      sentimentToShow = pickPhrase("efficientCut");
      sentimentState.efficiencyShown = true;
    } else if (isMidGame() && !sentimentState.stakesShown && guessesRemaining() <= 3) {
      sentimentToShow = pickPhrase("stakes");
      sentimentState.stakesShown = true;
    } else if (isCriticalRange() && !sentimentState.superCloseShown && newRange <= 25) {
      sentimentToShow = pickPhrase("superClose");
      sentimentState.superCloseShown = true;
      isCritical = true;
    }

    if (sentimentToShow) emitSentiment(sentimentToShow, isCritical);

    if (currentMode === MODES.MILLION) {
      millionGuessCounter++;
      updateMillionGuessDisplay();
    }

  }

  // --- 5. Update guess UI ---
  if (currentMode === MODES.DAILY && !gameOver) {
    persistDailyProgress();
  }

  if (!gameOver) {
    updateGuessUI();
  }
}

function updateGuessUI() {
  refreshRoundUI();
  feedback.style.opacity = 1;

  if (gameOver) {
    clearGuessCountMessage();
    bar.classList.remove("hint-ready");
    tipText.classList.remove("hint");
    return;
  }

  const remaining = maxGuessesForMode() - guesses.length;

  if (currentMode === MODES.INVERTED) {
    clearGuessCountMessage();
    bar.classList.remove("hint-ready");
    tipText.classList.remove("hint");
    clearFeedbackMessage();
    clearTipMessage();
    tipText.hidden = true;
    return;
  }

  if (currentMode !== MODES.DAILY && currentMode !== MODES.CLASSIC) {
    bar.classList.remove("hint-ready");
    tipText.style.display = "none";
    activeGuessCountMessage = null;
    activeTipMessage = null;
    return;
  }

  if (!hintAllowed) {
    bar.classList.remove("hint-ready", "hinted");
    tipText.style.display = "none";
    activeGuessCountMessage = null;
    activeTipMessage = null;
    return;
  }

  if (remaining > 1) {
    setGuessCountMessage("guessesLeft", { count: remaining });
    guessCount.style.color = "var(--muted)";
  } else if (remaining === 1) {
    setGuessCountMessage("finalGuess");
    guessCount.style.color = "var(--accent)";
    guessCount.style.fontWeight = "600";
  } else {
    clearGuessCountMessage();
  }

  if (
    !gameOver &&
    guesses.length === maxGuessesForMode() - 2 &&
    !lifelineUsed
  ) {
    bar.classList.add("hint-ready");
    clearTipMessage();
    tipText.classList.add("hint");
    tipText.style.display = "block";
    tipText.style.opacity = "1";
  } else {
    bar.classList.remove("hint-ready");
    tipText.classList.remove("hint");
    if (activeTipMessage?.key === "hintPrompt") {
      activeTipMessage = null;
    }
  }
}

function microReward(type) {
  if (type === "efficient") {
    barOrb.classList.remove("reward-flash");
    barOrb.offsetWidth; // restart animation
    barOrb.classList.add("reward-flash");
    setTimeout(() => barOrb.classList.remove("reward-flash"), 500);
  } else if (type === "streak") {
    const el = document.getElementById("streak");
    el.style.transition = "transform 0.3s ease";
    el.style.transform = "scale(1.15)";
    setTimeout(() => el.style.transform = "scale(1)", 400);
  }
}

/* ---------- GUESS ---------- */
function submitCurrentGuess() {
  if (gameOver || !helpModal.hidden) return;

  if (currentMode === MODES.INVERTED) return;
  const rawGuess = input.value.trim();
  const g = Number(rawGuess);
  if (!rawGuess || !Number.isInteger(g) || g < min || g > max) {
    showValidation();
    input.focus({ preventScroll: true });
    return;
  }
  clearValidation();
  clearToast();
  hintStatus.textContent = "";
  hintStatus.hidden = true;
  clearSentiment();

  if (demoRunning) return;

  if (demoMode) {
    dismissDemoPromptForLiveGame();
  }

  clearTipMessage();
  tipShown = true;

  if (currentMode === MODES.DAILY) markChallengeRecipientStarted();
  finalGuessContext = { min, max, guess: g };
  input.value = "";

  if (currentMode === MODES.DAILY || currentMode === MODES.CLASSIC) {
  resolveGuess(g);
} else {
  resolveFreePlayGuess(g);
}

  if (!gameOver) {
    if (isMobile()) {
      setTimeout(() => {
        if (gameOver) return;
        try {
          input.focus({ preventScroll: true });
        } catch {
          input.focus();
        }
      }, 0);
    } else {
      input.focus();

let suppressNextGuessClick = false;
let activeMobileGuessPointerId = null;
const GUESS_BUTTON_SLOP_PX = 18;

btn.addEventListener("pointerdown", (e) => {
  if (!isMobile() || e.pointerType === "mouse" || btn.disabled) return;
  e.preventDefault();
  activeMobileGuessPointerId = e.pointerId;
  try {
    btn.setPointerCapture(e.pointerId);
  } catch {}
});

btn.addEventListener("pointercancel", (e) => {
  if (e.pointerId === activeMobileGuessPointerId) {
    activeMobileGuessPointerId = null;
  }
});

btn.addEventListener("pointerup", (e) => {
  if (!isMobile() || e.pointerType === "mouse" || btn.disabled) return;
  if (e.pointerId !== activeMobileGuessPointerId) return;
  activeMobileGuessPointerId = null;

  const rect = btn.getBoundingClientRect();
  const withinExpandedBounds =
    e.clientX >= rect.left - GUESS_BUTTON_SLOP_PX &&
    e.clientX <= rect.right + GUESS_BUTTON_SLOP_PX &&
    e.clientY >= rect.top - GUESS_BUTTON_SLOP_PX &&
    e.clientY <= rect.bottom + GUESS_BUTTON_SLOP_PX;

  if (!withinExpandedBounds) return;
  e.preventDefault();
  suppressNextGuessClick = true;
  submitCurrentGuess();
});

btn.addEventListener("click", (e) => {

});

function updateOrb() {
  if (!barOrb) return;

  // Inverted mode controls orb position manually (edge start + drag).
  // Keep visual style synced, but never auto-snap to the secret while active.
  if (currentMode === MODES.INVERTED && !gameOver) {
    barOrb.style.background =
      "radial-gradient(circle at 30% 30%, rgba(108,242,194,0.95), rgba(72,210,160,1))";
    barOrb.style.boxShadow =
      "0 0 10px rgba(108,242,194,0.45), inset 0 1px 2px rgba(255,255,255,0.4)";
    barOrb.classList.remove("win-pulse");
    return;
  }

  // On game over, normalize range for clarity (DAILY only)
  if (gameOver && currentMode === MODES.DAILY) {
    min = MIN_RANGE;
    max = MAX_RANGE;

    minLabel.textContent = formatNumber(min);
    maxLabel.textContent = formatNumber(max);
    bar.setAttribute("aria-label", getMessage("remainingRangeAria", { min: formatNumber(min), max: formatNumber(max) }));
  }

  let percent;

  // 🔧 Determine authoritative normalization bounds
  const modeRange = getModeRange();
  const rangeMin = modeRange.min;
  const rangeMax = modeRange.max;

// Clamp min/max to valid range
min = Math.min(Math.max(rangeMin, min), rangeMax);
max = Math.max(min, Math.min(max, rangeMax));

  if (gameOver || min === max) {
    // Always point directly to the secret number (mode-correct)
    percent = ((secret - rangeMin) / (rangeMax - rangeMin)) * 100;
  } else {
    percent = ((secret - min) / (max - min)) * 100;
  }

  percent = Math.min(100, Math.max(0, percent));
  const previousPercent = Number.parseFloat(barOrb.style.left);
  const deltaPercent = Number.isFinite(previousPercent)
    ? Math.abs(percent - previousPercent)
    : 0;
  const travelDuration = Number.isFinite(deltaPercent)
    ? Math.min(0.64, Math.max(0.3, 0.3 + deltaPercent * 0.0044))
    : 0.42;

  setOrbTrackingTransition(travelDuration);
  const nextLeft = `${percent}%`;
  if (orbMoveRaf != null) {
    cancelAnimationFrame(orbMoveRaf);
    orbMoveRaf = null;
  }

  if (isMobile()) {
    orbMoveRaf = requestAnimationFrame(() => {
      barOrb.style.left = nextLeft;
      orbMoveRaf = null;
    });
  } else {
    barOrb.style.left = nextLeft;
  }

  if (
    !gameOver &&
    deltaPercent >= 0.4 &&
    !window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches
  ) {
    barOrb.classList.remove("orb-moving");
    barOrb.offsetWidth; // restart pulse
    barOrb.classList.add("orb-moving");
    clearTimeout(orbMovePulseTimer);
    orbMovePulseTimer = setTimeout(() => {
      barOrb.classList.remove("orb-moving");
    }, 220);
  }

  // Glow & pulse effect
  if (gameOver) {
    barOrb.style.background =
      "radial-gradient(circle at 30% 30%, rgba(255, 223, 100, 0.95), rgba(255, 200, 50, 1))";
    barOrb.style.boxShadow =
      "0 0 14px rgba(255, 223, 100, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.4)";
    barOrb.classList.toggle("win-pulse", gameResult === "win" && gameOverDisplaySource === "live");
  } else {
    barOrb.style.background =
      "radial-gradient(circle at 30% 30%, rgba(108,242,194,0.95), rgba(72,210,160,1))";
    barOrb.style.boxShadow =
      "0 0 10px rgba(108,242,194,0.45), inset 0 1px 2px rgba(255,255,255,0.4)";
    barOrb.classList.remove("win-pulse");
  }
}

  if (currentMode !== MODES.DAILY && currentMode !== MODES.CLASSIC) return;
  if (gameOver) return;

  // --- GA4 tracking ---
  if (typeof gtag === "function") {
    gtag("event", "game_win", {

      game_version: "v1.0"
    });

  gameOver = true;
  gameResult = "win";
  gameOverDisplaySource = "live";

  input.disabled = true;

  updateShareButton();

      result: "win",

      lifelineUsed,
      lifelineGuessIndex,
      mode: currentMode,
      resultBoard: finalGuessContext
    }));
    localStorage.setItem(dailyStateKey + "-result", "win");

  if (isDailyGame) {
    const etNow = new Date(new Date().toLocaleString("en-US", { timeZone: "America/New_York" }));
    const etYesterday = new Date(etNow);
    etYesterday.setDate(etYesterday.getDate() - 1);

    const yesterdayKey = `${etYesterday.getFullYear()}-${String(etYesterday.getMonth()+1).padStart(2,"0")}-${String(etYesterday.getDate()).padStart(2,"0")}`;
    const prevStreak = Number(localStorage.getItem("narroStreakPrev")) || 0;

    const streak = localStorage.getItem("narroLastPlayed") === yesterdayKey
      ? prevStreak + 1
      : 1;

    localStorage.setItem("narroStreakPrev", streak);
    localStorage.setItem("narroLastPlayed", todayKey);
    setStreakText(streak);
  }

  triggerWinVisuals();

  // --- Record session ---

}

function lose() {
  if (currentMode !== MODES.DAILY && currentMode !== MODES.CLASSIC) return;

  const isDailyGame = currentMode === MODES.DAILY;

function launchConfetti() {
  if (window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches) return;
  if (confettiFrame != null) cancelAnimationFrame(confettiFrame);
  const confetti = document.getElementById("confetti");  
  confetti.style.visibility = "visible";
  const ctx = confetti.getContext("2d");
  confetti.width = innerWidth; confetti.height = innerHeight;
  const pieces = Array.from({ length: 120 }, () => ({
    x: Math.random() * confetti.width,
    y: -20,
    vx: (Math.random() - 0.5) * 4,
    vy: Math.random() * 0.005 * innerHeight + 0.0025 * innerHeight,
    size: 6,
    color: `hsl(${Math.random() * 360},100%,70%)`
  }));

  function frame() {
    ctx.clearRect(0,0,confetti.width,confetti.height);
    pieces.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if (p.y < confetti.height) {
        ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size);
      }
    });
    if (pieces.some(p => p.y < confetti.height)) confettiFrame = requestAnimationFrame(frame);
    else {
      ctx.clearRect(0, 0, confetti.width, confetti.height);
      confettiFrame = null;
      confetti.style.visibility = "hidden";
    }
  }
  frame();
}
